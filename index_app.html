<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Campus Grupo Talenth · Plataforma Académica v1.3</title>
<meta name="description" content="Plataforma de gestión académica de Grupo Talenth: administración, docentes y estudiantes. Asistencia, notas, FUT, becas y aula invertida.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{
  --ink:#0a1b2e; --deep:#0e2a44; --ocean:#0e3a5c; --primary:#0a84ff; --sky:#38bdf8;
  --accent:#f43f5e; --accent-2:#e11d48; --amber:#ffb020; --green:#16a34a; --red:#e5484d;
  --violet:#8b5cf6; --teal:#14b8a6; --sand:#fff7ea; --paper:#eef2f6; --surface:#ffffff;
  --line:#dbe4ee; --muted:#5b7186; --text:#12283c;
  --grad-hero:linear-gradient(135deg,#0a1b2e 0%,#0e3a5c 45%,#0a84ff 120%);
  --grad-accent:linear-gradient(120deg,#f43f5e,#ff7a45);
  --grad-cool:linear-gradient(120deg,#0a84ff,#14b8a6);
  --shadow:0 10px 30px rgba(10,27,46,.10); --shadow-lg:0 24px 60px rgba(10,27,46,.18);
  --r:16px; --r-sm:10px; --nav-h:64px; --side-w:248px;
  --font-d:"Space Grotesk",system-ui,sans-serif; --font-b:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-b);background:var(--paper);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(700px 340px at 90% -60px,rgba(10,132,255,.10),transparent 60%),
             radial-gradient(560px 300px at -80px 40%,rgba(244,63,94,.07),transparent 60%),
             radial-gradient(420px 260px at 60% 110%,rgba(20,184,166,.07),transparent 60%);}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--paper)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--ocean),var(--primary));border-radius:8px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
h1,h2,h3,h4,.display{font-family:var(--font-d);letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--primary);text-decoration:none}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:24px;height:24px}.ic.xl{width:32px;height:32px}
/* ---------- shell ---------- */
#app{position:relative;z-index:1;min-height:100vh}
.topbar{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:60;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:rgba(10,27,46,.92);backdrop-filter:blur(12px);color:#fff;border-bottom:1px solid rgba(56,189,248,.25)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:700;font-size:17px;white-space:nowrap}
.brand .mark{width:36px;height:36px;border-radius:10px;background:var(--grad-accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(244,63,94,.4)}
.brand small{display:block;font-size:10px;font-weight:500;color:var(--sky);letter-spacing:.14em;text-transform:uppercase}
.role-switch{margin-left:auto;display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:12px}
.role-switch button{border:0;background:transparent;color:#bcd3e8;padding:7px 12px;border-radius:9px;font-weight:600;font-size:12px;display:flex;gap:6px;align-items:center}
.role-switch button.on{background:var(--grad-cool);color:#fff;box-shadow:0 4px 14px rgba(10,132,255,.4)}
.persona{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:6px 8px;font-size:12px;max-width:170px}
.persona option{color:var(--text)}
.bell{position:relative;border:0;background:rgba(255,255,255,.1);color:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.bell .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(244,63,94,.3)}
.layout{display:flex;padding-top:var(--nav-h)}
.sidebar{position:fixed;top:var(--nav-h);bottom:0;left:0;width:var(--side-w);background:var(--grad-hero);color:#cfe1f4;padding:18px 12px;overflow-y:auto;z-index:50}
.sidebar::-webkit-scrollbar-track{background:transparent}
.sidebar::-webkit-scrollbar-thumb{border-color:transparent;background:rgba(56,189,248,.4)}
.side-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7fa6c8;padding:10px 12px 6px}
.side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:#cfe1f4;font-weight:600;font-size:13px;margin-bottom:2px;border:1px solid transparent}
.side-link:hover{background:rgba(255,255,255,.07);color:#fff}
.side-link.on{background:rgba(10,132,255,.25);border-color:rgba(56,189,248,.4);color:#fff;box-shadow:inset 3px 0 0 var(--sky)}
.side-link .count{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:2px 7px}
.side-card{margin:14px 10px;padding:14px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(56,189,248,.25);font-size:12px}
.side-card b{color:#fff}
.main{margin-left:var(--side-w);flex:1;min-width:0;padding:24px 26px 90px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.view-head h1{font-size:26px;color:var(--ink)}
.view-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- components ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13px;transition:.18s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--grad-accent);color:#fff;box-shadow:0 8px 20px rgba(244,63,94,.3)}
.btn-p:hover{filter:brightness(1.08)}
.btn-b{background:var(--grad-cool);color:#fff;box-shadow:0 8px 20px rgba(10,132,255,.28)}
.btn-b:hover{filter:brightness(1.08)}
.btn-g{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn-g:hover{border-color:var(--primary);color:var(--primary)}
.btn-d{background:rgba(229,72,77,.1);color:var(--red);border:1px solid rgba(229,72,77,.3)}
.btn-ok{background:rgba(22,163,74,.12);color:var(--green);border:1px solid rgba(22,163,74,.35)}
.btn-sm{padding:7px 11px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:relative;overflow:hidden}
.card.hover{transition:.2s}.card.hover:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card .stripe{position:absolute;top:0;left:0;right:0;height:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.kpi .num{font-family:var(--font-d);font-size:26px;font-weight:700;color:var(--ink);line-height:1.1}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:20px;padding:3px 10px;letter-spacing:.02em}
.b-P{background:rgba(22,163,74,.13);color:var(--green)} .b-T{background:rgba(255,176,32,.16);color:#b26a00}
.b-F{background:rgba(229,72,77,.13);color:var(--red)} .b-J{background:rgba(139,92,246,.14);color:var(--violet)}
.b-C{background:rgba(20,184,166,.14);color:#0f766e}
.b-blue{background:rgba(10,132,255,.12);color:var(--primary)} .b-rose{background:rgba(244,63,94,.12);color:var(--accent-2)}
.b-gray{background:#e8eef5;color:var(--muted)} .b-amber{background:rgba(255,176,32,.16);color:#b26a00}
.b-green{background:rgba(22,163,74,.13);color:var(--green)} .b-red{background:rgba(229,72,77,.13);color:var(--red)}
.b-violet{background:rgba(139,92,246,.14);color:var(--violet)} .b-teal{background:rgba(20,184,166,.14);color:#0f766e}
.table-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:12px 14px;background:#f6f9fc;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--primary)}
td{padding:12px 14px;border-bottom:1px solid #edf2f8;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:.15s}tbody tr:hover{background:#f4f9ff}
.avatar{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:200px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding:10px 12px 10px 38px;border-radius:11px;border:1px solid var(--line);background:var(--surface)}
.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(10,132,255,.35);border-color:var(--primary)}
select.ctl,input.ctl{padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fbfdff}
.field textarea{min-height:74px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--text);background:var(--sand);border:1px solid #f0e2c8;border-radius:11px;padding:11px}
.check input{margin-top:2px;accent-color:var(--accent)}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:20px;color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.chip-s{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;cursor:default;transition:.15s}
.chip-s:hover{transform:scale(1.08)}
.chip-s.P{background:var(--green)}.chip-s.T{background:var(--amber)}.chip-s.F{background:var(--red)}
.chip-s.J{background:var(--violet)}.chip-s.C{background:var(--teal)}.chip-s.x{background:#e3eaf2;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:10px}
.tl-item{display:flex;gap:14px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);transition:.2s}
.tl-item:hover{transform:translateX(3px)}
.tl-item.live{background:var(--grad-hero);color:#fff;border-color:transparent}
.tl-item.live .tl-sub{color:#bcd3e8}
.tl-time{font-family:var(--font-d);font-weight:700;font-size:15px;width:64px;flex:none;display:flex;flex-direction:column;justify-content:center}
.tl-time small{font-size:11px;color:var(--muted);font-weight:600}
.tl-item.live .tl-time small{color:#9fc3e4}
.tl-body{flex:1;min-width:0}
.tl-title{font-weight:700;font-size:14.5px}
.tl-sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:#e6edf5;padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow:auto}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 3px 10px rgba(10,27,46,.12)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px 12px;text-align:center;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-3px);border-color:var(--primary)}
.tile.drag{opacity:.4}
.tile .t-ico{width:46px;height:46px;margin:0 auto 9px;border-radius:13px;display:grid;place-items:center;color:#fff}
.tile b{font-size:12.5px;display:block}
.tile small{color:var(--muted);font-size:10.5px}
.hero{background:var(--grad-hero);border-radius:20px;color:#fff;padding:24px;position:relative;overflow:hidden;margin-bottom:18px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(56,189,248,.35),transparent 70%)}
.hero h2{font-size:22px;margin-bottom:4px}
.hero p{color:#bcd3e8;font-size:13px;max-width:560px}
.hero .pay-banner{margin-top:16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:13px;padding:12px 14px;backdrop-filter:blur(6px)}
.msg-item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:13px;margin-bottom:10px}
.msg-item.sent{border-left-color:var(--green);opacity:.75}
.msg-item .m-txt{font-size:12.5px;white-space:pre-wrap}
.msg-item .m-meta{font-size:11px;color:var(--muted);margin-top:4px}
.player{background:var(--ink);border-radius:15px;overflow:hidden;color:#fff}
.player .screen{aspect-ratio:16/9;display:grid;place-items:center;background:
  radial-gradient(400px 200px at 30% 20%,rgba(10,132,255,.35),transparent),
  radial-gradient(300px 180px at 80% 80%,rgba(244,63,94,.3),transparent),var(--ink);position:relative}
.player .playbtn{width:64px;height:64px;border-radius:50%;border:0;background:var(--grad-accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(244,63,94,.5);transition:.2s}
.player .playbtn:hover{transform:scale(1.08)}
.player .bar{height:6px;background:rgba(255,255,255,.15)}
.player .bar i{display:block;height:100%;background:var(--grad-cool);width:0;transition:width .3s linear}
.player .p-meta{display:flex;justify-content:space-between;padding:10px 14px;font-size:12px;color:#bcd3e8}
.quiz-q{background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.quiz-q b{display:block;margin-bottom:9px;font-size:13.5px}
.opt{display:flex;gap:9px;align-items:center;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;margin-bottom:6px;cursor:pointer;font-size:13px;transition:.15s}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:rgba(10,132,255,.08);font-weight:600}
.opt.good{border-color:var(--green);background:rgba(22,163,74,.1)}
.opt.bad{border-color:var(--red);background:rgba(229,72,77,.08)}
/* ---------- modal / drawer / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,27,46,.55);backdrop-filter:blur(4px);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}
.scrim.on{display:flex}
.modal{background:var(--surface);border-radius:18px;max-width:640px;width:100%;box-shadow:var(--shadow-lg);animation:pop .22s ease}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--grad-hero);color:#fff;border-radius:18px 18px 0 0}
.modal header h3{font-size:16px}
.modal .m-body{padding:20px;max-height:66vh;overflow:auto}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#f8fafc;border-radius:0 0 18px 18px}
.x-btn{border:0;background:rgba(255,255,255,.15);color:#fff;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.drawer-scrim{position:fixed;inset:0;background:rgba(10,27,46,.4);z-index:85;display:none}
.drawer-scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:86;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:.28s ease;overflow-y:auto;padding:20px}
.drawer.on{transform:none}
.drawer h3{font-size:18px;color:var(--ink)}
#toasts{position:fixed;right:18px;bottom:calc(var(--nav-h) + 14px);z-index:120;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-lg);border-left:4px solid var(--sky);animation:pop .25s ease}
.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}
.toast button{margin-left:auto;border:0;background:var(--grad-accent);color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px}
.bottomnav{display:none}
.empty{padding:34px;text-align:center;color:var(--muted)}
.empty .ic{width:40px;height:40px;margin-bottom:8px;color:#b6c6d8}
.note{font-size:12px;color:var(--muted);background:#f4f8fc;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.cert{background:linear-gradient(160deg,#fffdf7,#fff);border:2px solid var(--amber);border-radius:18px;padding:26px;text-align:center;position:relative}
.cert::before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,176,32,.4);border-radius:12px;pointer-events:none}
.cert h2{font-size:22px;color:var(--ink)}
.cert .code{font-family:var(--font-d);letter-spacing:.12em;color:var(--accent-2);font-weight:700}
.qr-box{display:inline-grid;place-items:center;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line)}
.qr-box svg,.qr-box img{display:block;width:132px;height:132px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:600}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block;margin-right:5px;vertical-align:-1px}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .sidebar{display:none}
  .main{margin-left:0;padding:16px 14px 110px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
  .role-switch button span{display:none}
  .persona{max-width:110px}
  .brand small{display:none}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);background:rgba(10,27,46,.96);backdrop-filter:blur(12px);z-index:70;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8fb2d2;font-size:10px;font-weight:700;padding:6px 10px;border-radius:10px}
  .bottomnav a.on{color:#fff;background:rgba(10,132,255,.3)}
  #toasts{bottom:calc(var(--nav-h) + 10px);left:14px;right:14px;max-width:none}
  .chips{grid-template-columns:repeat(4,1fr)}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .view-head h1{font-size:21px}
}
@media print{.topbar,.sidebar,.bottomnav,.head-actions,#toasts{display:none!important}.main{margin:0;padding:0}body{background:#fff}}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">

const group=id=>S.groups.find(g=>g.id===id);

const enrolledIn=(sid,gid)=>S.enrollments.some(e=>e.studentId===sid&&e.groupId===gid&&e.estado==="activa");
const groupSessions=gid=>S.sessions.filter(s=>s.groupId===gid).sort((a,b)=>a.n-b.n);
const attFor=(seid,sid)=>S.attendance.find(a=>a.sessionId===seid&&a.studentId===sid);
const actFor=(seid,sid)=>S.activities.find(a=>a.sessionId===seid&&a.studentId===sid);
function maxFaltas(g){return Math.floor(g.numSesiones*0.25)}
function record(sid,gid){
  const g=group(gid), ses=groupSessions(gid);
  const rows=ses.map(se=>({se,at:attFor(se.id,sid)}));
  const cerradas=rows.filter(r=>r.at&&r.se.estado!=="programada");
  const faltas=cerradas.filter(r=>r.at.estado==="F").length;
  const asist=cerradas.filter(r=>["P","T","J","C"].includes(r.at.estado)).length;
  const pct=cerradas.length?Math.round(asist/cerradas.length*100):100;
  const notas=cerradas.filter(r=>r.at.nota!=null).map(r=>r.at.nota);
  const prom=notas.length?Math.round(notas.reduce((a,b)=>a+b,0)/notas.length*10)/10:null;
  const deuda=S.payments.some(p=>p.studentId===sid&&["pendiente","por_vencer","vencido"].includes(p.estado));
  const okF=faltas<=maxFaltas(g), okN=prom==null||prom>=11, okD=!deuda;
  return {faltas,asist,pct,prom,deuda,okF,okN,okD,habilitado:okF&&okN&&okD,max:maxFaltas(g),total:g.numSesiones,cerradas:cerradas.length};
}
function conflict(sid,gid){
  const g=group(gid);
  for(const e of S.enrollments.filter(e=>e.studentId===sid&&e.estado==="activa"&&e.groupId!==gid)){
    const o=group(e.groupId);
    const sameDay=g.dias.some(d=>o.dias.includes(d));
    const overlap=toMin(g.hi)<toMin(o.hf)&&toMin(o.hi)<toMin(g.hf);
    const gEnd=addDays(g.fechaInicio,g.numSesiones*7), oEnd=addDays(o.fechaInicio,o.numSesiones*7);
    const dateOverlap=g.fechaInicio<=oEnd&&o.fechaInicio<=gEnd;
    if(sameDay&&overlap&&dateOverlap)return o;
  }
  return null;
}
function correctionOpen(se){const lim=addDays(se.fecha,1)+"T23:59:59";return new Date()<=new Date(lim);}
function queueMsg(evento,sid,canal,texto){S.messages.unshift({id:uid("ms"),evento,studentId:sid,canal,texto,estado:"pendiente",generadoEn:Date.now(),enviadoEn:null,enviadoPor:null});}
function waLink(m){const num=m.canal==="admin"?S.config.notifyNumber:(m.canal==="1"?student(m.studentId).canal1:student(m.studentId).canal2);return "https://wa.me/"+num+"?text="+encodeURIComponent(m.texto);}
function runCutoff(force){
  const t=today(), h=new Date().getHours();
  if(!force&&(h<S.config.cutoffHour||S.cutoffs[t]))return 0;
  let n=0;
  S.sessions.filter(se=>se.fecha===addDays(t,1)&&se.estado==="programada").forEach(se=>{
    S.enrollments.filter(e=>e.groupId===se.groupId).forEach(e=>{
      const ac=actFor(se.id,e.studentId);
      if(ac&&!ac.pre.completadoEn){const st=student(e.studentId);
        queueMsg("corte",st.id,"1","Hola "+st.nombres+". Mañana "+ftime(se.hi)+" tienes clase y aún NO completas la actividad previa (video + pre-quiz). Complétala hoy para llegar preparado/a.");
        if(st.tutor)queueMsg("corte",st.id,"2","Estimado tutor de "+st.nombres+": el/la estudiante no completó la actividad previa de mañana "+ftime(se.hi)+". Recordatorio de acompañamiento.");
        n++;}
    });
    const doc=S.users.find(u=>u.id===group(se.groupId).docenteId);
    const pend=S.enrollments.filter(e=>e.groupId===se.groupId).filter(e=>{const a=actFor(se.id,e.studentId);return a&&!a.pre.completadoEn}).map(e=>student(e.studentId).nombres);
    if(pend.length)queueMsg("corte-doc",null,"admin","Resumen pre-clase "+group(se.groupId).nombre+" ("+fdate(se.fecha)+"): sin actividad → "+pend.join(", ")+".");
  });
  S.cutoffs[t]=true;save();return n;
}
function closeSession(seid){
  const se=session(seid), g=group(seid?se.groupId:"");
  se.estado="cerrada";se.cerradaEn=Date.now();
  const enrolled=S.enrollments.filter(e=>e.groupId===se.groupId);
  const resumen=[];
  enrolled.forEach(e=>{
    let at=attFor(seid,e.studentId);
    if(!at){at={id:uid("at"),sessionId:seid,studentId:e.studentId,estado:"F",nota:0,notaOrigen:"ausencia",checkin:null,history:[]};S.attendance.push(at);}
    if(at.estado==="F"){at.nota=0;at.notaOrigen="ausencia";
      const st=student(e.studentId);
      queueMsg("cierre",st.id,"1","Hola "+st.nombres+". Se registró FALTA y nota 0 en "+course(g.courseId).nombre+" (sesión "+fdate(se.fecha)+"). Puedes regularizar con un FUT en administración.");
      if(st.tutor)queueMsg("cierre",st.id,"2","Estimado tutor de "+st.nombres+" "+st.apellidos+": falta y nota 0 registradas el "+fdate(se.fecha)+" en "+course(g.courseId).nombre+". Trámite FUT disponible.");
      resumen.push(st.nombres+" "+st.apellidos+" (F / 0)");
    }
  });
  if(resumen.length)queueMsg("cierre-admin",null,"admin","REPORTE DE FALTAS · "+g.nombre+" · "+fdate(se.fecha)+" → "+resumen.join("; ")+". Contactar para seguimiento FUT.");
  audit("Cierre de sesión",se.id+" · "+resumen.length+" faltas notificadas");
  save();
}
function validateFut(code,sid,seid,tipo){
  const f=futByCode(code);
  if(!f)return{ok:false,err:"El código FUT no existe en el sistema."};
  if(f.studentId!==sid)return{ok:false,err:"El FUT pertenece a otro estudiante."};
  if(seid&&f.sessionId&&f.sessionId!==seid)return{ok:false,err:"El FUT no corresponde a esta sesión."};
  if(tipo&&f.tipo!==tipo)return{ok:false,err:"Tipo de trámite incompatible ("+f.tipo+")."};
  if(f.estado!=="conforme")return{ok:false,err:"El FUT no está CONFORME (estado: "+f.estado+"). Administración debe validar el pago."};
  if(f.usadoEn)return{ok:false,err:"El FUT ya fue ejecutado; un código = un cambio."};
  if(f.conformeEn&&Date.now()-f.conformeEn>7*86400000)return{ok:false,err:"FUT vencido (vigencia 7 días desde conformidad)."};
  return{ok:true,f};
}

/* ============================== ROUTER ============================== */
function route(){
  const h=location.hash||"#/admin";
  const p=h.replace("#/","").split("/");
  if(p[0]==="verificar"){shell(vVerify(p[1]||""),h);return;}
  if(p[0]==="checkin"){const se=session(p[1]);if(se&&ui.role==="estudiante"){doCheckin(se.id);}location.hash="#/est";return;}
  let content="";
  if(ui.role==="admin"){
    if(p[1]==="estudiantes")content=vAdminEst();
    else if(p[1]==="cursos")content=vAdminCursos();
    else if(p[1]==="sesiones")content=vAdminSesiones();
    else if(p[1]==="fut")content=vAdminFut();
    else if(p[1]==="pagos")content=vAdminPagos();
    else if(p[1]==="certificados")content=vAdminCert();
    else if(p[1]==="reportes")content=vAdminReportes();
    else if(p[1]==="mensajes")content=vAdminMensajes();
    else if(p[1]==="config")content=vAdminConfig();
    else content=vAdminDash();
  } else if(ui.role==="docente"){
    if(p[1]==="sesion")content=vDocSesion(p[2]);
    else if(p[1]==="grupos")content=vDocGrupos();
    else if(p[1]==="actividades")content=vDocActividades();
    else if(p[1]==="avisos")content=vDocAvisos();
    else content=vDocHoy();
  } else {
    if(p[1]==="cursos")content=vEstCursos();
    else if(p[1]==="curso")content=vEstCurso(p[2]);
    else if(p[1]==="aula")content=vEstAula(p[2]);
    else if(p[1]==="pagos")content=vEstPagos();
    else if(p[1]==="alertas")content=vEstAlertas();
    else if(p[1]==="perfil")content=vEstPerfil();
    else if(p[1]==="fut")content=vEstFut();
    else content=vEstInicio();
  }
  shell(content,h);
  bindDynamic();
}
function render(){save();route();}

function doCheckin(seid){
  const sid=ui.student,se=session(seid);
  if(!enrolledIn(sid,seid)){toast("No estás matriculado en esta sesión.","err");return;}
  if(attFor(seid,sid)){toast("Ya registraste tu check-in.","warn");return;}
  const diff=nowMin()-toMin(se.hi);
  const est=diff<=15?"P":diff<=30?"T":"F";
  S.attendance.push({id:uid("at"),sessionId:seid,studentId:sid,estado:est,nota:est==="F"?0:null,notaOrigen:est==="F"?"ausencia":null,checkin:{ts:Date.now(),metodo:group(se.groupId).sede==="Virtual"?"link":"qr"},history:[]});
  audit("Check-in",sid+" · "+seid+" · "+est);
  toast(est==="P"?"Check-in registrado: PRESENTE ✓":est==="T"?"Check-in registrado: TARDANZA":"Fuera de ventana: FALTA","ok");
  render();
}
function bindDynamic(){
  const q=$("#est-q");if(q){q.addEventListener("input",()=>{ui.estQ=q.value;$("#est-tbody").innerHTML=estBody(estRows());$("#est-count").textContent=estRows().length+" registros";});}
  const f=$("#est-filter");if(f)f.addEventListener("change",()=>{ui.estFilter=f.value;render();});
  const rs=$("#rep-student");if(rs)rs.addEventListener("change",()=>{ui.reportStudent=rs.value;render();});
  $$(".opt").forEach(o=>o.addEventListener("click",()=>{o.parentElement.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));o.classList.add("sel");}));
  // drag tiles
  let dragEl=null;
  $$("#tiles .tile").forEach(t=>{
    t.addEventListener("dragstart",()=>{dragEl=t;t.classList.add("drag");});
    t.addEventListener("dragend",()=>{t.classList.remove("drag");dragEl=null;});
    t.addEventListener("dragover",e=>e.preventDefault());
    t.addEventListener("drop",e=>{e.preventDefault();if(!dragEl||dragEl===t)return;const order=[...$$("#tiles .tile")].map(x=>x.dataset.tile);const from=order.indexOf(dragEl.dataset.tile),to=order.indexOf(t.dataset.tile);order.splice(from,1);order.splice(to,0,dragEl.dataset.tile);S.ui.tileOrder=order;save();render();toast("Servicios reordenados.");});
  });
}

  if(a==="save-draft"){toast("Borrador guardado (sin notificaciones).");save();return;}
  if(a==="close-session"){const se=session(id);
    $$(".att-sel").forEach(sel=>{const st=sel.dataset.st;let at=attFor(id,st);if(!at){at={id:uid("at"),sessionId:id,studentId:st,estado:"P",nota:null,notaOrigen:null,checkin:null,history:[]};S.attendance.push(at);}at.estado=sel.value;});
    $$(".nota-in").forEach(inp=>{const at=attFor(id,inp.dataset.st);if(at&&inp.value!==""){at.nota=Math.max(0,Math.min(20,+inp.value));at.notaOrigen="clase";}});
    closeSession(id);toast("Sesión cerrada · faltas y ceros notificados a canales 1, 2 y administración.");location.hash="#/docente";render();return;}
  if(a==="save-corrections"){const se=session(id);
    if(!correctionOpen(se)){toast("Ventana cerrada. Usa un FUT conforme.","err");return;}
    let changed=0;
    $$(".att-sel").forEach(sel=>{const at=attFor(id,sel.dataset.st);if(at&&at.estado!==sel.value){at.history.push({ts:Date.now(),from:at.estado,to:sel.value});at.estado=sel.value;changed++;
      if(sel.value!=="F"){const st=student(at.studentId);queueMsg("erratas",st.id,"1","Fe de erratas: tu registro del "+fdate(se.fecha)+" fue corregido a "+sel.value+".");if(st.tutor)queueMsg("erratas",st.id,"2","Fe de erratas: el registro de "+st.nombres+" del "+fdate(se.fecha)+" fue corregido a "+sel.value+".");}}});
    $$(".nota-in").forEach(inp=>{const at=attFor(id,inp.dataset.st);const v=inp.value===""?null:Math.max(0,Math.min(20,+inp.value));if(at&&at.nota!==v){at.history.push({ts:Date.now(),from:at.nota,to:v});at.nota=v;changed++;}});
    audit("Corrección en ventana",id+" · "+changed+" cambios");toast(changed?changed+" correcciones guardadas con fe de erratas.":"Sin cambios.");render();return;}
  if(a==="fut-change"){const se=session(id);
    openModal("Cambio post-ventana · requiere FUT conforme",`<form id="frm-futchange"><div class="field"><label>Código FUT</label><input name="code" required placeholder="GT-FUT-2026-000101"></div><div class="field"><label>Estudiante</label><select name="sid">${S.enrollments.filter(x=>x.groupId===se.groupId).map(x=>{const s=student(x.studentId);return `<option value="${s.id}">${esc(s.nombres)} ${esc(s.apellidos)}</option>`}).join("")}</select></div><div class="frow"><div class="field"><label>Nueva asistencia</label><select name="est"><option>P</option><option>T</option><option>J</option></select></div><div class="field"><label>Nueva nota</label><input name="nota" type="number" min="0" max="20" required></div></div><div class="note">Se valida: existencia, estudiante/sesión, tipo, conformidad de pago, no usado y vigencia.</div></form>`,`<button class="btn btn-g" data-action="close-modal">Cancelar</button><button class="btn btn-p" data-action="submit-futchange" data-id="${id}">${icon("shield")} Validar y aplicar</button>`);return;}
  if(a==="submit-futchange"){const fd=new FormData($("#frm-futchange"));const se=session(id);
    const v=validateFut(fd.get("code"),fd.get("sid"),id,fd.get("est")==="J"?"justificacion":"revision");
    if(!v.ok){toast(v.err,"err");return;}
    let at=attFor(id,fd.get("sid"));if(!at){at={id:uid("at"),sessionId:id,studentId:fd.get("sid"),estado:"P",nota:null,notaOrigen:null,checkin:null,history:[]};S.attendance.push(at);}
    at.history.push({ts:Date.now(),from:at.estado+"/"+at.nota,to:fd.get("est")+"/"+fd.get("nota"),fut:v.f.codigo});
    at.estado=fd.get("est");at.nota=Math.max(0,Math.min(20,+fd.get("nota")));at.notaOrigen="rezagado";
    v.f.estado="ejecutado";v.f.usadoEn=Date.now();
    audit("Cambio con FUT",v.f.codigo+" · "+id);closeModal();toast("FUT válido · cambio aplicado y código ejecutado.");render();return;}
  if(a==="play-video"){const se=session(id);const ac=actFor(id,ui.student);let p=0;const bar=$("#vbar"),tm=$("#vtime");el.disabled=true;
    const iv=setInterval(()=>{p+=4;if(bar)bar.style.width=p+"%";if(tm)tm.textContent=Math.floor(p*2.4/60)+":"+pad(Math.floor(p*2.4%60))+" / 4:00";
      if(p>=100){clearInterval(iv);if(ac){ac.pre.visto=true;}save();toast("Video visto ✓ · ahora responde el pre-quiz.");render();}},120);return;}
  if(a==="tab"){ui.tab[el.dataset.key]=el.dataset.tab;render();return;}
  if(a==="copy"){navigator.clipboard?.writeText(el.dataset.text).then(()=>toast("Copiado al portapapeles."));return;}
  if(a==="export-csv"){const sid=ui.reportStudent||S.students[0].id;let csv="Curso,Fecha,Asistencia,Nota\n";S.enrollments.filter(e=>e.studentId===sid).forEach(e=>{groupSessions(e.groupId).forEach(se=>{const a=attFor(se.id,sid);csv+=`"${course(group(e.groupId).courseId).nombre}",${se.fecha},${a?a.estado:""},${a&&a.nota!=null?a.nota:""}\n`;});});
    const b=new Blob([csv],{type:"text/csv"});const u=URL.createObjectURL(b);const l=document.createElement("a");l.href=u;l.download="record-"+sid+".csv";l.click();toast("CSV exportado.");return;}
  if(a==="print"){window.print();return;}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.action==="persona"){ui.persona=el.value;render();}
  if(el.dataset.action==="student-sel"){ui.student=el.value;render();}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="frm-verify"){const code=new FormData(f).get("code").trim().toUpperCase();location.hash="#/verificar/"+code;return;}
  if(f.classList.contains("quiz-form")){
    const kind=f.dataset.kind,seid=f.dataset.se,se=session(seid);const qs=kind==="pre"?se.preQuiz:se.postQuiz;
    const fd=new FormData(f);let correct=0;
    qs.forEach((q,i)=>{if(+fd.get("q"+i)===q.a)correct++;});
    const score=Math.round(correct/qs.length*20);
    let ac=actFor(seid,ui.student);if(!ac){ac={id:uid("ac"),sessionId:seid,studentId:ui.student,pre:{visto:false,quizScore:null,completadoEn:null,tardio:false},post:{score:null,completadoEn:null}};S.activities.push(ac);}
    if(kind==="pre"){ac.pre.quizScore=score;ac.pre.completadoEn=Date.now();ac.pre.tardio=se.fecha<=today();}
    else{ac.post.score=score;ac.post.completadoEn=Date.now();}
    audit(kind==="pre"?"Pre-quiz":"Post-quiz",seid+" · "+score+"/20");
    toast("Quiz enviado · "+score+"/20.","ok");render();return;}
});
$("#dscrim").addEventListener("click",closeDrawer);
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal();});
function openCert(c){const st=student(c.studentId),g=group(c.groupId);
  openModal("Certificado emitido",`<div class="cert"><h2>CERTIFICADO</h2><p style="margin:8px 0">Otorgado a <b>${esc(st.nombres)} ${esc(st.apellidos)}</b></p><p style="font-size:13px;color:var(--muted)">${esc(course(g.courseId).nombre)}</p><p style="font-size:13px;margin:8px 0">Promedio <b>${c.snapshot.prom}</b> · Asistencia <b>${c.snapshot.pct}%</b></p><div class="code">${esc(c.codigo)}</div><div class="qr-box" style="margin-top:12px">${qrSVG(verifyURL(c.codigo))}</div><div style="font-size:11px;color:var(--muted);margin-top:8px">Verifica en ${esc(verifyURL(c.codigo))}</div></div>`,`<button class="btn btn-g" data-action="copy" data-text="${esc(verifyURL(c.codigo))}">${icon("copy")} Copiar enlace</button><button class="btn btn-b" data-action="print">${icon("print")} Imprimir</button><button class="btn btn-p" data-action="close-modal">Listo</button>`,true);
}
window.addEventListener("hashchange",route);
load();runCutoff(false);route();
</script>
</body>
