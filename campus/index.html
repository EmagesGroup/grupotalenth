function loadData(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed();if(!r)localStorage.setItem(KEY,JSON.stringify(S));}catch(e){S=seed();}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));if(sb){clearTimeout(pushTimer);pushTimer=setTimeout(push,700);}}
async function push(){if(!sb){sbStatus='sin librería';updateNet();return;}try{const {error}=await sb.from("campus_state").upsert({id:"main",data:S,updated_at:new Date().toISOString()});if(error){sbStatus='error al subir: '+error.message;netMode='local';}else{sbStatus='ok';netMode='cloud';lastRemote=Date.now();}updateNet();}catch(e){sbStatus='catch al subir: '+e.message;netMode='local';updateNet();}}
async function pullCloud(){if(!window.supabase){sbStatus='la librería Supabase NO cargó';netMode='local';updateNet();return;}if(!sb){try{sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){sbStatus='cliente falló: '+e.message;updateNet();return;}}sbStatus='probando…';updateNet();try{const {data,error}=await sb.from("campus_state").select("*").eq("id","main").single();if(error){sbStatus='nube rechazó: '+error.message;netMode='local';}else if(!data||!data.data){sbStatus='nube OK pero vacía → subiendo datos locales';netMode='cloud';await push();}else{lastRemote=new Date(data.updated_at).getTime();S=data.data;localStorage.setItem(KEY,JSON.stringify(S));netMode='cloud';sbStatus='ok';if(currentUser)route(location.hash||"#/home");}}catch(e){sbStatus='error de red: '+e.message;netMode='local';}updateNet();}

async function doLogin(){const phone=$("#login-phone").value.trim(),pin=$("#login-pin").value.trim(),err=$("#login-err");err.textContent="";if(!phone||!pin){err.textContent="Completa celular y clave";return;}$("#btn-login").disabled=true;$("#btn-login").textContent="Verificando…";try{const h=await hashPin(pin);const u=USERS.find(x=>x.phone===phone&&x.pin===h);if(!u){err.textContent="Credenciales incorrectas";return;}currentUser=u;localStorage.setItem(SKEY,JSON.stringify(u));enterApp();}catch(e){err.textContent="Error: "+e.message;}finally{$("#btn-login").disabled=false;$("#btn-login").textContent="Ingresar";}}

function calcEdad(fechaNac){if(!fechaNac)return 0;const hoy=new Date();const nac=new Date(fechaNac+"T12:00:00");let edad=hoy.getFullYear()-nac.getFullYear();const m=hoy.getMonth()-nac.getMonth();if(m<0||(m===0&&hoy.getDate()<nac.getDate()))edad--;return edad;}

function openStudentForm(id){
 const s=id?S.students.find(x=>x.id===id):{nombres:"",apellidos:"",dni:"",fechaNac:"",genero:"",canal1:"",canal2:"",email:"",direccion:"",distrito:"",colegio:"",ocupacion:"",programa:"",nivel:"",track:"",modalidad:"",sede:"",turno:"",fechaMatricula:"",captacion:"",subCanal:"",asesor:"",beca:null,formaPago:"",alergias:"",tutor:null,estado:"activo",observaciones:""};
 const edad=calcEdad(s.fechaNac);
 const esMenor=edad<18;
 $("#modal-title").textContent=id?"Editar estudiante":"Nuevo estudiante";
 $("#modal-body").innerHTML=`
 <div class="section-title">📋 Datos personales</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <label>DNI <span class="req">*</span><input class="fi" id="f-dni" value="${esc(s.dni)}" maxlength="8" inputmode="numeric"></label>
  <label>Género <span class="req">*</span><select class="fi" id="f-genero"><option value="">—</option>${GENEROS.map(g=>`<option ${s.genero===g?"selected":""}>${g}</option>`).join("")}</select></label>
  <label>Nombres <span class="req">*</span><input class="fi" id="f-nom" value="${esc(s.nombres)}"></label>
  <label>Apellidos <span class="req">*</span><input class="fi" id="f-ape" value="${esc(s.apellidos)}"></label>
  <label>Fecha de nacimiento <span class="req">*</span><input class="fi" id="f-nac" type="date" value="${esc(s.fechaNac)}" onchange="updateEdad()"></label>
  <label>Edad (auto)<input class="fi" id="f-edad" value="${edad}" readonly style="background:#f5f9fc"></label>
 </div>
 <div class="section-title">📞 Contacto</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <label>Celular estudiante <span class="req">*</span><input class="fi" id="f-c1" value="${esc(s.canal1)}" inputmode="numeric"></label>
  <label>Celular pagador/tutor <span class="req">*</span><input class="fi" id="f-c2" value="${esc(s.canal2)}" inputmode="numeric"></label>
  <label>Email (opcional)<input class="fi" id="f-email" type="email" value="${esc(s.email)}"></label>
  <label>Distrito<input class="fi" id="f-dist" value="${esc(s.distrito)}"></label>
  <label>Dirección<input class="fi" id="f-dir" value="${esc(s.direccion)}"></label>
 </div>
 <div class="section-title">🎓 Académico previo</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <label>Colegio de procedencia<input class="fi" id="f-col" value="${esc(s.colegio)}"></label>
  <label>Ocupación actual<select class="fi" id="f-ocup"><option value="">—</option><option value="Estudiante" ${s.ocupacion==="Estudiante"?"selected":""}>Estudiante</option><option value="Trabajador" ${s.ocupacion==="Trabajador"?"selected":""}>Trabajador</option><option value="Desempleado" ${s.ocupacion==="Desempleado"?"selected":""}>Desempleado</option></select></label>
 </div>
 <div class="section-title">📚 Programa actual</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <label>Programa/Carrera <span class="req">*</span><select class="fi" id="f-prog"><option value="">—</option>${PROGRAMAS.map(p=>`<option ${s.programa===p?"selected":""}>${p}</option>`).join("")}</select></label>
  <label>Nivel <span class="req">*</span><select class="fi" id="f-niv"><option value="">—</option>${NIVELES.map(n=>`<option ${s.nivel===n?"selected":""}>${n}</option>`).join("")}</select></label>
  <label>Track <span class="req">*</span><select class="fi" id="f-track"><option value="">—</option>${TRACKS.map(t=>`<option ${s.track===t?"selected":""}>${t}</option>`).join("")}</select></label>
  <label>Modalidad <span class="req">*</span><select class="fi" id="f-mod"><option value="">—</option>${MODALIDADES.map(m=>`<option ${s.modalidad===m?"selected":""}>${m}</option>`).join("")}</select></label>
  <label>Sede <span class="req">*</span><select class="fi" id="f-sede"><option value="">—</option>${SEDES.map(s2=>`<option ${s.sede===s2?"selected":""}>${s2}</option>`).join("")}</select></label>
  <label>Turno <span class="req">*</span><select class="fi" id="f-turno"><option value="">—</option>${TURNOS.map(t=>`<option ${s.turno===t?"selected":""}>${t}</option>`).join("")}</select></label>
  <label>Fecha de matrícula <span class="req">*</span><input class="fi" id="f-mat" type="date" value="${esc(s.fechaMatricula)}"></label>
 </div>
 <div class="section-title">📢 Captación y comercial</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <label>Canal de captación <span class="req">*</span><select class="fi" id="f-cap"><option value="">—</option>${CAPS.map(c=>`<option ${s.captacion===c?"selected":""}>${c}</option>`).join("")}</select></label>
  <label>Sub-canal (opcional)<select class="fi" id="f-subcap"><option value="">—</option>${SUBCAPS.map(sc=>`<option ${s.subCanal===sc?"selected":""}>${sc}</option>`).join("")}</select></label>
  <label>Asesor que atendió<input class="fi" id="f-asesor" value="${esc(s.asesor)}"></label>
 </div>
 <div class="section-title">💰 Económico</div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <label>Beca <span class="req">*</span><select class="fi" id="f-beca"><option value="">Sin beca</option><option value="total" ${s.beca&&s.beca.tipo==="total"?"selected":""}>Total 100%</option><option value="parcial" ${s.beca&&s.beca.tipo==="parcial"?"selected":""}>Parcial 50%</option></select></label>
  <label>Forma de pago <span class="req">*</span><select class="fi" id="f-pago"><option value="">—</option>${FORMAS_PAGO.map(f=>`<option ${s.formaPago===f?"selected":""}>${f}</option>`).join("")}</select></label>
 </div>
 <div class="section-title">🩺 Salud</div>
 <div style="display:grid;grid-template-columns:1fr;gap:12px">
  <label>Alergias (opcional)<input class="fi" id="f-alergias" value="${esc(s.alergias)}" placeholder="Ninguna, o describe..."></label>
 </div>
 <div id="tutor-section" class="tutor-section" style="display:${esMenor?'block':'none'}">
  <span class="tutor-badge">👨‍👩‍👧 MENOR DE EDAD — Datos del tutor legal</span>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
   <label>Nombre del tutor <span class="req">*</span><input class="fi" id="f-tutor-nom" value="${esc(s.tutor?.nombre||'')}"></label>
   <label>DNI del tutor <span class="req">*</span><input class="fi" id="f-tutor-dni" value="${esc(s.tutor?.dni||'')}" maxlength="8" inputmode="numeric"></label>
   <label>Relación <span class="req">*</span><select class="fi" id="f-tutor-rel"><option value="">—</option><option value="Madre" ${s.tutor?.relacion==="Madre"?"selected":""}>Madre</option><option value="Padre" ${s.tutor?.relacion==="Padre"?"selected":""}>Padre</option><option value="Apoderado" ${s.tutor?.relacion==="Apoderado"?"selected":""}>Apoderado</option></select></label>
   <label>Teléfono del tutor <span class="req">*</span><input class="fi" id="f-tutor-tel" value="${esc(s.tutor?.telefono||'')}" inputmode="numeric"></label>
  </div>
 </div>
 <div class="section-title">⚙️ Estado</div>
 <div style="display:grid;grid-template-columns:1fr;gap:12px">
  <label>Estado<select class="fi" id="f-estado"><option value="activo" ${s.estado==="activo"?"selected":""}>Activo</option><option value="inactivo" ${s.estado==="inactivo"?"selected":""}>Inactivo</option><option value="egresado" ${s.estado==="egresado"?"selected":""}>Egresado</option></select></label>
  <label>Observaciones internas<textarea class="fi" id="f-obs" rows="3">${esc(s.observaciones||'')}</textarea></label>
 </div>
 <div style="margin-top:20px;display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="saveStudent('${id||""}')">Guardar</button></div>`;
 $("#modal-bg").style.display="flex";
}
function updateEdad(){const nac=$("#f-nac").value;const edad=calcEdad(nac);$("#f-edad").value=edad;const tutorSec=$("#tutor-section");if(tutorSec)tutorSec.style.display=edad<18?'block':'none';}
function closeModal(){$("#modal-bg").style.display="none";}
function saveStudent(id){
 const g=x=>$("#"+x).value.trim();
 const dni=g("f-dni"),nom=g("f-nom"),ape=g("f-ape"),nac=g("f-nac"),gen=g("f-genero"),c1=g("f-c1"),c2=g("f-c2"),prog=g("f-prog"),niv=g("f-niv"),track=g("f-track"),mod=g("f-mod"),sede=g("f-sede"),turno=g("f-turno"),mat=g("f-mat"),cap=g("f-cap"),pago=g("f-pago");
 if(!dni||!nom||!ape||!nac||!gen||!c1||!c2||!prog||!niv||!track||!mod||!sede||!turno||!mat||!cap||!pago){toast("Completa todos los campos obligatorios (*)");return;}
 if(dni.length!==8){toast("DNI debe tener 8 dígitos");return;}
 const edad=calcEdad(nac);
 const data={dni,nombres:nom,apellidos:ape,fechaNac:nac,genero:gen,edad,canal1:c1,canal2:c2,email:g("f-email"),direccion:g("f-dir"),distrito:g("f-dist"),colegio:g("f-col"),ocupacion:g("f-ocup"),programa:prog,nivel:niv,track,modalidad:mod,sede,turno,fechaMatricula:mat,captacion:cap,subCanal:g("f-subcap"),asesor:g("f-asesor"),beca:g("f-beca")?{tipo:g("f-beca"),pct:g("f-beca")==="total"?100:50}:null,formaPago:pago,alergias:g("f-alergias"),estado:g("f-estado"),observaciones:g("f-obs")};
 if(edad<18){const tNom=g("f-tutor-nom"),tDni=g("f-tutor-dni"),tRel=g("f-tutor-rel"),tTel=g("f-tutor-tel");if(!tNom||!tDni||!tRel||!tTel){toast("Completa los datos del tutor (obligatorio para menores)");return;}data.tutor={nombre:tNom,dni:tDni,relacion:tRel,telefono:tTel};}else{data.tutor=null;}
 if(id){Object.assign(S.students.find(x=>x.id===id),data);}else{data.id=uid("st");data.codigo="GT-"+String(S.students.length+1).padStart(3,"0");S.students.push(data);}
 save();closeModal();toast(id?"Actualizado ✓":"Estudiante registrado ✓");renderUsers();
}
function delStudent(id){if(confirm("¿Eliminar este estudiante?")){S.students=S.students.filter(x=>x.id!==id);S.enrollments=S.enrollments.filter(e=>e.studentId!==id);save();toast("Eliminado");renderUsers();}}
function renderUsers(){
 $("#view").innerHTML=`<div class="vh"><h1>Estudiantes</h1><button class="btn btn-p" onclick="openStudentForm()">+ Nuevo estudiante</button></div>
 <div class="tw"><table><thead><tr><th>Código</th><th>Nombre</th><th>Edad</th><th>Programa</th><th>Track</th><th>Captación</th><th>Distrito</th><th>Beca</th><th>Estado</th><th></th></tr></thead><tbody>
 ${S.students.map(s=>`<tr><td><b>${esc(s.codigo)}</b></td><td>${esc(s.nombres)} ${esc(s.apellidos)}</td><td>${calcEdad(s.fechaNac)}</td><td>${esc(s.programa||'—')}</td><td>${esc(s.track||'—')}</td><td>${esc(s.captacion||"—")}</td><td>${esc(s.distrito||"—")}</td><td>${s.beca?`<span class="badge b-violet">${s.beca.pct}%</span>`:"Regular"}</td><td>${s.estado==='activo'?'<span class="badge b-green">Activo</span>':esc(s.estado)}</td><td><button class="btn btn-g btn-sm" onclick="openStudentForm('${s.id}')">✎</button> <button class="btn btn-g btn-sm" style="color:var(--red)" onclick="delStudent('${s.id}')">🗑</button></td></tr>`).join("")||`<tr><td colspan="10" style="text-align:center;color:var(--muted)">Sin estudiantes.</td></tr>`}
 </tbody></table></div>`;
}

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}

$("#btn-login").addEventListener("click",doLogin);
$("#login-pin").addEventListener("keypress",e=>{if(e.key==="Enter")doLogin();});
$("#btn-logout").addEventListener("click",logout);
window.addEventListener("online",()=>{pullCloud();});
window.addEventListener("offline",()=>{netMode='local';sbStatus='sin internet (modo contingencia activo)';updateNet();});

loadData();
checkSession();
pullCloud();
</script>
</body>
</html>
