<style>
:root{--ink:#071a2c;--ocean:#0e4d78;--primary:#0a84ff;--sky:#4cc3ff;--accent:#ff3b5c;--amber:#ffb020;--green:#17b26a;--red:#f04438;--violet:#8b5cf6;--teal:#12b76a;--paper:#eef4f9;--surface:#fff;--line:#d7e3ee;--muted:#5c7186;--text:#0f2438;--sand:#fff6e8;--grad-hero:linear-gradient(135deg,#071a2c,#0e4d78 52%,#0a84ff 125%);--grad-hot:linear-gradient(120deg,#ff3b5c,#ff8a3d);--grad-cool:linear-gradient(120deg,#0a84ff,#12b76a);--shadow:0 12px 34px rgba(7,26,44,.12);--r:16px;--nav:64px;--side:252px;--fd:"Space Grotesk",system-ui;--fb:"Inter",system-ui}

::-webkit-scrollbar{width:11px;height:11px}::-webkit-scrollbar-track{background:#e2ecf4}::-webkit-scrollbar-thumb{background:linear-gradient(var(--ocean),var(--primary));border-radius:9px;border:2px solid #e2ecf4}::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* LOGIN */
#login-screen{position:fixed;inset:0;z-index:200;background:var(--grad-hero);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:24px;padding:40px 30px;width:100%;max-width:400px;box-shadow:0 25px 50px rgba(0,0,0,.25);text-align:center}
.login-box .mark{width:64px;height:64px;border-radius:18px;background:var(--grad-hot);display:grid;place-items:center;margin:0 auto 20px;box-shadow:0 10px 25px rgba(255,59,92,.4)}
.login-box h2{font-family:var(--fd);font-size:24px;color:var(--ink);margin-bottom:8px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;margin-bottom:14px;text-align:center;letter-spacing:1px}
.login-box input:focus{outline:none;border-color:var(--primary)}
.login-box button{width:100%;padding:14px;border-radius:12px;border:0;background:var(--grad-hot);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 8px 20px rgba(255,59,92,.3)}
.login-box button:active{transform:scale(.98)}
.login-box .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}
.login-box .help{margin-top:20px;font-size:11px;color:var(--muted);line-height:1.5}

#app{position:relative;z-index:1;min-height:100vh}
.topbar{position:fixed;inset:0 0 auto;height:var(--nav);z-index:70;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(7,26,44,.95);backdrop-filter:blur(14px);color:#fff;border-bottom:1px solid rgba(76,195,255,.28)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:15px;white-space:nowrap}.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--grad-hot);display:grid;place-items:center}.brand small{display:block;font-size:9px;color:var(--sky);letter-spacing:.16em;text-transform:uppercase}
.user-info{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#bcd3e8}.user-info b{color:#fff}
.iconbtn{border:0;background:rgba(255,255,255,.11);color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;position:relative;cursor:pointer}.iconbtn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.layout{display:flex;padding-top:var(--nav)}

.side-label{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#7fa6c8;padding:8px 12px 6px}
.side-link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;color:#cfe1f4;font-weight:600;font-size:12.5px;margin-bottom:2px;text-decoration:none}.side-link:hover{background:rgba(255,255,255,.08);color:#fff}.side-link.on{background:rgba(10,132,255,.28);color:#fff;box-shadow:inset 3px 0 0 var(--sky)}.side-link .count{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:2px 7px}
.side-card{margin:14px 8px;padding:12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(76,195,255,.28);font-size:11px}.side-card b{color:#fff}
.main{margin-left:var(--side);flex:1;min-width:0;padding:22px 24px 96px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}.vh h1{font-size:25px;color:var(--ink)}.vh .sub{color:var(--muted);font-size:13px;margin-top:2px}.ha{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13px;transition:.18s;white-space:nowrap}.btn:active{transform:scale(.97)}.btn-p{background:var(--grad-hot);color:#fff;box-shadow:0 8px 22px rgba(255,59,92,.32)}.btn-b{background:var(--grad-cool);color:#fff}.btn-g{background:var(--surface);color:var(--text);border:1px solid var(--line)}.btn-g:hover{border-color:var(--primary);color:var(--primary)}.btn-d{background:rgba(240,68,56,.1);color:var(--red);border:1px solid rgba(240,68,56,.32)}.btn-ok{background:rgba(23,178,106,.12);color:var(--green);border:1px solid rgba(23,178,106,.36)}.btn-sm{padding:7px 11px;font-size:12px;border-radius:9px}.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:relative;overflow:hidden}.card.hover{transition:.2s}.card.hover:hover{transform:translateY(-3px)}.stripe{position:absolute;inset:0 0 auto;height:4px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{display:flex;gap:14px;align-items:center}.kpi .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}.kpi .num{font-family:var(--fd);font-size:26px;font-weight:700;color:var(--ink);line-height:1.1}.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:20px;padding:3px 10px}.b-green{background:rgba(23,178,106,.14);color:var(--green)}.b-amber{background:rgba(255,176,32,.18);color:#a35b00}.b-red{background:rgba(240,68,56,.13);color:var(--red)}.b-violet{background:rgba(139,92,246,.15);color:var(--violet)}.b-teal{background:rgba(18,183,106,.14);color:#087443}.b-blue{background:rgba(10,132,255,.13);color:var(--primary)}.b-gray{background:#e7eef5;color:var(--muted)}
.tw{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:680px}th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:12px 14px;background:#f5f9fc;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:12px 14px;border-bottom:1px solid #edf3f8;font-size:13px;vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr:hover{background:#f3f9ff}
.avatar{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.search{position:relative;flex:1;min-width:210px}.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}.search input{width:100%;padding:10px 12px 10px 38px;border-radius:11px;border:1px solid var(--line)}
select.ctl,input.ctl{padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-weight:600}.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(10,132,255,.35);border-color:var(--primary)}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fbfdff}.field textarea{min-height:70px}.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;background:var(--sand);border:1px solid #f0dfc2;border-radius:11px;padding:11px}.check input{margin-top:2px;accent-color:var(--accent)}
.ring{position:relative;width:96px;height:96px;flex:none}.ring svg{transform:rotate(-90deg)}.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:20px;color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.chip-s{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}.chip-s.P{background:var(--green)}.chip-s.T{background:var(--amber)}.chip-s.F{background:var(--red)}.chip-s.J{background:var(--violet)}.chip-s.C{background:var(--teal)}.chip-s.x{background:#e2eaf2;color:var(--muted)}
.timeline{display:flex;flex-direction:column;gap:10px}.tl-item{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}.tl-item.live{background:var(--grad-hero);color:#fff;border-color:transparent}.tl-item.live .tl-sub{color:#bcd3e8}.tl-time{font-family:var(--fd);font-weight:700;font-size:15px;width:66px;flex:none}.tl-time small{display:block;font-size:11px;color:var(--muted)}.tl-item.live .tl-time small{color:#9fc3e4}.tl-body{flex:1;min-width:0}.tl-title{font-weight:700;font-size:14.5px}.tl-sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:#e5edf5;padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow:auto;margin-bottom:16px}.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 3px 10px rgba(7,26,44,.13)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px 12px;text-align:center;transition:.2s;box-shadow:var(--shadow);text-decoration:none;color:inherit}.tile:hover{transform:translateY(-3px);border-color:var(--primary)}.tile .t-ico{width:46px;height:46px;margin:0 auto 9px;border-radius:14px;display:grid;place-items:center;color:#fff}.tile b{font-size:12.5px;display:block}
.hero{background:var(--grad-hero);border-radius:20px;color:#fff;padding:24px;position:relative;overflow:hidden;margin-bottom:18px}.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(76,195,255,.4),transparent 70%)}.hero h2{font-size:22px;margin-bottom:4px}.hero p{color:#bcd3e8;font-size:13px}.pay-banner{margin-top:16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.22);border-radius:13px;padding:12px 14px}
.msg-item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:12px;padding:13px;margin-bottom:10px}.msg-item.sent{border-left-color:var(--green);opacity:.78}.m-txt{font-size:12.5px;white-space:pre-wrap}.m-meta{font-size:11px;color:var(--muted);margin-top:4px}
.player{background:var(--ink);border-radius:15px;overflow:hidden;color:#fff}.player .screen{aspect-ratio:16/9;display:grid;place-items:center;background:radial-gradient(420px 220px at 30% 20%,rgba(10,132,255,.4),transparent),radial-gradient(320px 200px at 80% 80%,rgba(255,59,92,.32),transparent),var(--ink)}.playbtn{width:64px;height:64px;border-radius:50%;border:0;background:var(--grad-hot);color:#fff;display:grid;place-items:center}.player .bar{height:6px;background:rgba(255,255,255,.16)}.player .bar i{display:block;height:100%;background:var(--grad-cool);width:0;transition:width .3s linear}.p-meta{display:flex;justify-content:space-between;padding:10px 14px;font-size:12px;color:#bcd3e8}
.quiz-q{background:#f5f9fc;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.quiz-q b{display:block;margin-bottom:9px;font-size:13.5px}.opt{display:flex;gap:9px;align-items:center;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;margin-bottom:6px;cursor:pointer;font-size:13px}.opt.sel{border-color:var(--primary);background:rgba(10,132,255,.08);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(7,26,44,.58);backdrop-filter:blur(5px);z-index:95;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto}.scrim.on{display:flex}.modal{background:var(--surface);border-radius:18px;max-width:680px;width:100%;box-shadow:0 26px 70px rgba(7,26,44,.22);animation:pop .22s ease}.modal.wide{max-width:920px}@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--grad-hero);color:#fff;border-radius:18px 18px 0 0}.modal .m-body{padding:20px;max-height:66vh;overflow:auto}.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#f7fafc;border-radius:0 0 18px 18px}.x-btn{border:0;background:rgba(255,255,255,.16);color:#fff;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.drawer-scrim{position:fixed;inset:0;background:rgba(7,26,44,.42);z-index:88;display:none}.drawer-scrim.on{display:block}.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:89;box-shadow:0 26px 70px rgba(7,26,44,.22);transform:translateX(100%);transition:.28s ease;overflow-y:auto;padding:20px}.drawer.on{transform:none}
#toasts{position:fixed;right:18px;bottom:calc(var(--nav) + 14px);z-index:130;display:flex;flex-direction:column;gap:8px;max-width:370px}.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 26px 70px rgba(7,26,44,.22);border-left:4px solid var(--sky);animation:pop .25s ease}.toast.ok{border-left-color:var(--green)}.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}.toast button{margin-left:auto;border:0;background:var(--grad-hot);color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px}
.bottomnav{display:none}.empty{padding:34px;text-align:center;color:var(--muted)}.note{font-size:12px;color:var(--muted);background:#f3f8fc;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.cert{background:linear-gradient(160deg,#fffdf6,#fff);border:2px solid var(--amber);border-radius:18px;padding:26px;text-align:center}.cert h2{font-size:22px;color:var(--ink)}.cert .code{font-family:var(--fd);letter-spacing:.12em;color:#e11d48;font-weight:700}.qr-box{display:inline-grid;place-items:center;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line)}.qr-box svg{display:block;width:132px;height:132px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:600}.legend i{width:11px;height:11px;border-radius:4px;display:inline-block;margin-right:5px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}.bar-row .bl{width:150px;font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar-row .bt{flex:1;height:12px;background:#e8eef5;border-radius:8px;overflow:hidden}.bar-row .bt i{display:block;height:100%;background:var(--grad-cool);border-radius:8px}.bar-row .bn{width:36px;text-align:right;font-weight:800;font-size:12px;color:var(--ink)}
@media(max-width:1080px){.g4,.g3{grid-template-columns:repeat(2,1fr)}.frow3{grid-template-columns:1fr}}
@media(max-width:860px){.sidebar{display:none}.main{margin-left:0;padding:16px 14px 112px}.g2,.g3,.g4{grid-template-columns:1fr}.frow,.frow3{grid-template-columns:1fr}.brand small{display:none}.bottomnav{display:flex;position:fixed;inset:auto 0 0;height:var(--nav);background:rgba(7,26,44,.97);backdrop-filter:blur(14px);z-index:75;justify-content:space-around;align-items:center}.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8fb2d2;font-size:10px;font-weight:700;padding:6px 9px;border-radius:10px;text-decoration:none}.bottomnav a.on{color:#fff;background:rgba(10,132,255,.32)}#toasts{bottom:calc(var(--nav) + 10px);left:14px;right:14px;max-width:none}.chips{grid-template-columns:repeat(4,1fr)}.vh h1{font-size:21px}}
@media print{.topbar,.sidebar,.bottomnav,.ha,#toasts{display:none!important}.main{margin:0;padding:0}body{background:#fff}}
</style>

// Hash SHA-256
async function hashPin(pin){
  const encoder=new TextEncoder();
  const data=encoder.encode(pin);
  const hashBuffer=await crypto.subtle.digest('SHA-256',data);
  const hashArray=Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');
}

function bindDynamic(){
  const q=$("#est-q");if(q)q.oninput=()=>{ui.estQ=q.value;const l=estRows();$("#est-tbody").innerHTML=estBody(l);$("#est-count").textContent=l.length+" registros";};
  $$(".opt").forEach(o=>o.onclick=()=>{o.parentElement.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));o.classList.add("sel");});
}

// Event listeners
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");if(!el)return;
  const a=el.dataset.action;
  if(a==="logout"){logout();return;}
  if(a==="close-modal"){closeModal();return;}
  if(a==="close-drawer"){closeDrawer();return;}
  // ... (aquí van las acciones, te las doy en la Parte 2) ...
});
document.addEventListener("change",e=>{
  const el=e.target,k=el.dataset.change;
  if(k==="est-filter"){ui.estFilter=el.value;render();}
  if(k==="report-student"){ui.reportStudent=el.value;render();}
  if(k==="pub-prog"){ui.pub={...ui.pub,prog:el.value,niv:"",ciclo:"",frec:"",turno:"",searched:false};render();}
  if(k==="pub-niv"){ui.pub={...ui.pub,niv:el.value,ciclo:"",frec:"",turno:"",searched:false};render();}
  if(k==="pub-ciclo"){ui.pub={...ui.pub,ciclo:el.value,frec:"",turno:"",searched:false};render();}
  if(k==="pub-frec"){ui.pub={...ui.pub,frec:el.value,turno:"",searched:false};render();}
  if(k==="pub-turno"){ui.pub={...ui.pub,turno:el.value,searched:false};render();}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;if(f.classList.contains("quiz-form")){const kind=f.dataset.kind,seid=f.dataset.se,se=session(seid),qs=kind==="pre"?se.preQuiz:se.postQuiz,fd=new FormData(f);let ok=0;qs.forEach((q,i)=>{if(+fd.get("q"+i)===q.a)ok++;});const score=Math.round(ok/qs.length*20);let ac=actFor(seid,currentUser.studentId||ui.student);if(!ac){ac={id:uid("ac"),sessionId:seid,studentId:currentUser.studentId||ui.student,pre:{visto:false,quizScore:null,completadoEn:null,tardio:false},post:{score:null,completadoEn:null}};S.activities.push(ac);}if(kind==="pre"){ac.pre.quizScore=score;ac.pre.completadoEn=Date.now();ac.pre.tardio=se.fecha<=today();}else{ac.post.score=score;ac.post.completadoEn=Date.now();}toast("Quiz: "+score+"/20");render();}});
$("#dscrim").onclick=closeDrawer;$("#scrim").onclick=e=>{if(e.target.id==="scrim")closeModal();};
$("#btn-login").addEventListener("click",doLogin);
$("#login-pin").addEventListener("keypress",e=>{if(e.key==="Enter")doLogin();});

// Init
if(window.supabase){initSB();}else{toast("Cargando sistema...","warn");window.addEventListener("load",initSB);}
</script>
</body>
</html>
