</style>

function runCutoff(){const t=today();let n=0;
 S.sessions.filter(se=>se.fecha===addDays(t,1)&&se.estado==="programada").forEach(se=>{const g=group(se.groupId),pend=[];
  enrollsOf(se.groupId).forEach(e=>{const st=student(e.studentId);if(!st)return;
   queueMsg("corte",st.id,"1",`Hola ${st.nombres}. Mañana ${ftime(se.hi)} tienes clase de ${g.nombre}. Recuerda llegar puntual y traer tu material.`);
   if(st.tutor)queueMsg("corte",st.id,"2",`Recordatorio: ${st.nombres} tiene clase mañana ${fdate(se.fecha)} a las ${ftime(se.hi)} (${g.nombre}).`);
   pend.push(st.nombres);n++});
  if(pend.length)queueMsg("corte-doc",null,"admin",`Pre-clase ${g.nombre} (${fdate(se.fecha)} ${ftime(se.hi)}): ${pend.length} alumnos → ${pend.join(", ")}.`)});
 S.cutoffs[t]=true;audit("Corte de recordatorios",n+" mensajes");save();return n}
function validateFut(code,sid,seid){const f=S.futs.find(x=>x.codigo===String(code).trim().toUpperCase());
 if(!f)return{ok:false,err:"Código FUT inexistente"};
 if(f.studentId!==sid)return{ok:false,err:"El FUT pertenece a otro estudiante"};
 if(seid&&f.sessionId&&f.sessionId!==seid)return{ok:false,err:"El FUT no corresponde a esta sesión"};
 if(f.estado!=="conforme")return{ok:false,err:"FUT no CONFORME ("+f.estado+")"};
 if(f.usadoEn)return{ok:false,err:"FUT ya ejecutado"};
 if(f.conformeEn&&Date.now()-f.conformeEn>7*86400000)return{ok:false,err:"FUT vencido (7 días)"};
 return{ok:true,f}}

 const d={concepto:c,aplica:$("#t-ap").value.trim(),monto:+$("#t-m").value||0,vigencia:$("#t-v").value.trim(),activo:$("#t-a").value==="1"};
 if(id)Object.assign(S.catalogs.tarifario.find(x=>x.id===id),d);else S.catalogs.tarifario.push(Object.assign({id:uid("t")},d));
 audit("Tarifario",c);save();closeModal();vCatalogs();toast("Concepto guardado ✓")}

function vConfig(){if(!guardSuper())return;
 $("#view").innerHTML=head("Configuración","Parámetros institucionales y auditoría","")+
 `<div class="grid g2"><div class="card"><h3 style="margin-bottom:12px">Notificaciones</h3>
 <label>Número WhatsApp institucional<input class="fi" id="cfg-num" value="${esc(S.config.notifyNumber)}"></label>
 <label style="margin-top:12px">Hora de corte<input class="fi" id="cfg-cut" type="number" min="0" max="23" value="${S.config.cutoffHour}"></label>
 <label style="margin-top:12px">Correo institucional<input class="fi" id="cfg-mail" value="${esc(S.config.email)}"></label>
 <button class="btn btn-b" style="margin-top:14px" onclick="saveConfig()">${icon("check")} Guardar</button></div>
 <div class="card"><h3 style="margin-bottom:12px">Accesos del sistema</h3>${USERS.map(u=>`<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #edf3f8">${avatar(u.name,"width:28px;height:28px;font-size:10px")}<span style="flex:1;font-size:13px"><b>${esc(u.name)}</b><div style="font-size:11px;color:var(--muted)">${esc(u.phone)} · ${u.role}</div></span></div>`).join("")}
 <div class="note" style="margin-top:12px">Los accesos se definen en el código por seguridad. Para agregar docentes, edita la constante USERS y DOCENTES.</div></div>
 <div class="card" style="grid-column:1/-1"><h3 style="margin-bottom:12px">Auditoría reciente</h3><div class="tw"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>${S.audit.slice(0,40).map(a=>`<tr><td>${new Date(a.ts).toLocaleString("es-PE")}</td><td>${esc(a.user)}</td><td><b>${esc(a.accion)}</b></td><td style="font-size:12px;color:var(--muted)">${esc(a.detalle)}</td></tr>`).join("")||`<tr><td colspan="4"><div class="empty">Sin registros.</div></td></tr>`}</tbody></table></div></div></div>`}
function saveConfig(){S.config.notifyNumber=$("#cfg-num").value.replace(/\D/g,"");S.config.cutoffHour=+$("#cfg-cut").value||15;S.config.email=$("#cfg-mail").value.trim();
 audit("Configuración","parámetros actualizados");save();renderSidebar();markNav("#/config");toast("Configuración guardada ✓")}

function vBackup(){
 $("#view").innerHTML=head("Nube y respaldo","Login local garantizado · nube como espejo · contingencia activa",
 `<button class="btn btn-g" onclick="pullCloud().then(()=>toast('Prueba terminada'))">${icon("cloud")} Probar conexión</button><button class="btn btn-p" onclick="push().then(()=>toast('Subido a la nube ✓'))">${icon("up")} Subir ahora</button>`)+
 `<div class="grid g2"><div class="card"><h3 style="margin-bottom:10px">Diagnóstico en vivo</h3><div class="diag" id="diag">${esc(sbStatus)}</div>
 <div style="margin-top:10px;font-size:13px">Modo <b>${netMode==="cloud"?"☁ Nube":"📴 Local"}</b> · ${S.students.length} estudiantes · ${S.sessions.length} sesiones · ${S.attendance.length} registros de asistencia</div></div>
 <div class="card"><h3 style="margin-bottom:10px">Respaldo institucional</h3><p style="font-size:13px;color:var(--muted);margin-bottom:12px">Excel con una hoja por tabla para archivo y auditoría. JSON para restauración exacta. El código F-XXX vincula cada ficha con tu archivo físico.</p>
 <div class="ha"><button class="btn btn-b" onclick="exportXLSX()">${icon("down")} Excel completo</button><button class="btn btn-g" onclick="exportJSON()">${icon("down")} JSON</button><button class="btn btn-g" onclick="exportCSV()">${icon("down")} CSV activos</button><label class="btn btn-g" style="cursor:pointer">${icon("up")} Importar JSON<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"></label></div></div>
 <div class="card" style="grid-column:1/-1"><h3 style="margin-bottom:10px">Escala y contingencia</h3><p style="font-size:13px;color:var(--muted)">Por defecto solo se procesan <b>activos</b>; inactivos, egresados y retirados quedan archivados y solo se consultan al filtrarlos. La paginación de 25 en 25 mantiene la app rápida al crecer. Si Supabase se cae o no hay internet, el login y el trabajo siguen en local y se sincroniza al volver la red.</p></div></div>`;updateNet()}
function download(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function exportJSON(){download("campus-talenth-"+today()+".json",JSON.stringify(S,null,2),"application/json");toast("JSON descargado ✓")}
function exportCSV(){const rows=[["Codigo","DNI","Nombres","Apellidos","Edad","Genero","Canal1","Canal2","Distrito","Programa","Nivel","Track","Modalidad","Sede","Turno","Captacion","SubCanal","Beca","FormaPago","Estado","Alergias","Tutor","FormatoFisico"]];
 S.students.filter(s=>s.estado==="activo").forEach(s=>rows.push([s.codigo,s.dni,s.nombres,s.apellidos,calcEdad(s.fechaNac),s.genero,s.canal1,s.canal2,s.distrito,s.programa,s.nivel,s.track,s.modalidad,s.sede,s.turno,s.captacion,s.subCanal,s.beca?s.beca.pct+"%":"",s.formaPago,s.estado,s.alergias,s.tutor?s.tutor.nombre:"",s.formFisico]));
 download("estudiantes-activos-"+today()+".csv","\uFEFF"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv;charset=utf-8");toast("CSV descargado ✓")}
function exportXLSX(){
 const sheets={
 Estudiantes:S.students.map(s=>({Codigo:s.codigo,DNI:s.dni,Nombres:s.nombres,Apellidos:s.apellidos,Edad:calcEdad(s.fechaNac),Nacimiento:s.fechaNac,Genero:s.genero,Canal1:s.canal1,Canal2:s.canal2,Distrito:s.distrito,Direccion:s.direccion,Colegio:s.colegio,Ocupacion:s.ocupacion,Programa:s.programa,Nivel:s.nivel,Track:s.track,Modalidad:s.modalidad,Sede:s.sede,Turno:s.turno,Matricula:s.fechaMatricula,Captacion:s.captacion,SubCanal:s.subCanal,Asesor:s.asesor,Beca:s.beca?s.beca.pct+"%":"",FormaPago:s.formaPago,Alergias:s.alergias,Tutor:s.tutor?s.tutor.nombre:"",TutorDNI:s.tutor?s.tutor.dni:"",Estado:s.estado,FormatoFisico:s.formFisico})),
 Grupos:S.groups.map(g=>({ID:g.id,Nombre:g.nombre,Programa:g.programa,Nivel:g.nivel,Dias:(g.dias||[]).map(d=>DIAS[d]).join("+"),Inicio:g.hi,Fin:g.hf,Sesiones:g.numSesiones,MaxFaltas:maxF(g),Sede:g.sede,Aula:g.aula,Costo:g.costo,Docente:(DOCENTES.find(d=>d.id===g.docenteId)||{}).name||""})),
 Matriculas:S.enrollments.map(e=>({Estudiante:(student(e.studentId)||{}).codigo,Grupo:(group(e.groupId)||{}).nombre,Estado:e.estado})),
 Sesiones:S.sessions.map(se=>({Grupo:(group(se.groupId)||{}).nombre,Sesion:se.n,Fecha:se.fecha,Inicio:se.hi,Fin:se.hf,Estado:se.estado,Motivo:se.motivoC})),
 Asistencia:S.attendance.map(a=>({Sesion:(session(a.sessionId)||{}).fecha,Grupo:(group((session(a.sessionId)||{}).groupId)||{}).nombre,Estudiante:(student(a.studentId)||{}).codigo,Estado:a.estado,Nota:a.nota??"",Origen:a.notaOrigen,Cambios:(a.history||[]).length})),
 FUT:S.futs.map(f=>({Codigo:f.codigo,Estudiante:(student(f.studentId)||{}).codigo,Tramite:f.tipo,Arancel:f.arancel,Estado:f.estado,Detalle:f.detalle})),
 Pagos:S.payments.map(p=>({Estudiante:(student(p.studentId)||{}).codigo,Concepto:p.concepto,Periodo:p.periodo,Monto:p.monto,Vence:p.vencimiento,Estado:p.estado})),
 Certificados:S.certificates.map(c=>({Codigo:c.codigo,Estudiante:(student(c.studentId)||{}).codigo,Grupo:(group(c.groupId)||{}).nombre,Promedio:c.snapshot.prom,Asistencia:c.snapshot.pct,Faltas:c.snapshot.faltas})),
 Mensajes:S.messages.map(m=>({Evento:m.evento,Estudiante:m.studentId?(student(m.studentId)||{}).codigo:"Interno",Canal:m.canal,Estado:m.estado,Texto:m.texto})),
 Tarifario:S.catalogs.tarifario,Justificantes:S.catalogs.justificantes,Captacion:S.catalogs.captacion,Auditoria:S.audit};
 if(window.XLSX){const wb=XLSX.utils.book_new();Object.entries(sheets).forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.length?d:[{Info:"Sin registros"}]),n.slice(0,31)));
 XLSX.writeFile(wb,"respaldo-grupo-talenth-"+today()+".xlsx");toast("Excel completo descargado ✓")}
 else{exportJSON();toast("Excel no disponible: se descargó JSON","warn")}}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.students)throw 0;S=migrate(d);audit("Importación JSON",f.name);save();toast("Respaldo importado ✓");route("#/home")}catch(e){toast("JSON inválido","err")}};r.readAsText(f)}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast("Copiado ✓")).catch(()=>toast("No se pudo copiar","err"))}
function toast(msg,type="ok",undo){const t=document.createElement("div");t.className="toast "+(type==="ok"?"":type);
 t.innerHTML=icon(type==="err"?"x":"check")+`<span>${esc(msg)}</span>`+(undo?`<button>Deshacer</button>`:"");
 if(undo)t.querySelector("button").onclick=()=>{undo();t.remove()};$("#toasts").appendChild(t);setTimeout(()=>t.remove(),undo?7000:3600)}

$("#login-pin").addEventListener("keypress",e=>{if(e.key==="Enter")doLogin()});
$("#login-phone").addEventListener("keypress",e=>{if(e.key==="Enter")$("#login-pin").focus()});

$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDrawer()}});

loadLocal();checkSession();pullCloud();
