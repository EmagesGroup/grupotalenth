<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campus Grupo Talenth · v1.7 Estable</title>
<meta name="theme-color" content="#071a2c">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#071a2c;--ocean:#0e4d78;--primary:#0a84ff;--accent:#ff3b5c;--green:#17b26a;--red:#f04438;--paper:#eef4f9;--surface:#fff;--line:#d7e3ee;--muted:#5c7186;--grad-hero:linear-gradient(135deg,#071a2c,#0e4d78 52%,#0a84ff 125%);--grad-hot:linear-gradient(120deg,#ff3b5c,#ff8a3d);--r:16px;--nav:64px;--side:240px;--fd:"Space Grotesk",system-ui;--fb:"Inter",system-ui}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.ic.lg{width:24px;height:24px}
#login-screen{position:fixed;inset:0;z-index:200;background:var(--grad-hero);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:24px;padding:40px 30px;width:100%;max-width:400px;box-shadow:0 25px 50px rgba(0,0,0,.25);text-align:center}
.login-box .mark{width:64px;height:64px;border-radius:18px;background:var(--grad-hot);display:grid;place-items:center;margin:0 auto 20px}
.login-box h2{font-family:var(--fd);font-size:24px;margin-bottom:8px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;margin-bottom:14px;text-align:center}
.login-box input:focus{outline:none;border-color:var(--primary)}
.login-box button{width:100%;padding:14px;border-radius:12px;border:0;background:var(--grad-hot);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.login-box .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}
.login-box .help{margin-top:20px;font-size:11px;color:var(--muted)}
#app{display:none;min-height:100vh}
.topbar{position:fixed;inset:0 0 auto;height:var(--nav);z-index:70;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(7,26,44,.95);backdrop-filter:blur(14px);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:15px}.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--grad-hot);display:grid;place-items:center}
.user-info{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#bcd3e8}.user-info b{color:#fff}
.iconbtn{border:0;background:rgba(255,255,255,.11);color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.layout{display:flex;padding-top:var(--nav)}
.sidebar{position:fixed;top:var(--nav);bottom:0;left:0;width:var(--side);background:var(--grad-hero);color:#cfe1f4;padding:16px 10px;overflow-y:auto}
.side-label{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#7fa6c8;padding:8px 12px 6px}
.side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:#cfe1f4;font-weight:600;font-size:13px;margin-bottom:2px;text-decoration:none}
.side-link:hover{background:rgba(255,255,255,.08);color:#fff}
.side-link.on{background:rgba(10,132,255,.28);color:#fff;box-shadow:inset 3px 0 0 var(--primary)}
.main{margin-left:var(--side);flex:1;padding:24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}.vh h1{font-size:24px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer}.btn-p{background:var(--grad-hot);color:#fff}.btn-g{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{display:flex;gap:14px;align-items:center}.kpi .num{font-family:var(--fd);font-size:26px;font-weight:700}.kpi .lbl{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800}.b-green{background:rgba(23,178,106,.14);color:var(--green)}.b-amber{background:rgba(255,176,32,.18);color:#a35b00}
.tw{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;background:#f5f9fc;border-bottom:1px solid var(--line)}td{padding:12px 14px;border-bottom:1px solid #edf3f8;font-size:13px}
.avatar{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.toast{position:fixed;right:18px;bottom:80px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;z-index:300;animation:pop .3s ease}.toast.ok{border-left:4px solid var(--green)}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:860px){.sidebar{display:none}.main{margin-left:0;padding:16px}.g2,.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3l7 8h-4v10H9V11H5l7-8z"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V11z"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.5 3.4-5.5 6.5-5.5s5.8 2 6.5 5.5M16 4.6a3.5 3.5 0 010 6.8"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h14v18H6a2 2 0 00-2 2V5z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></symbol>
<symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
</svg>

<div id="login-screen">
  <div class="login-box">
    <div class="mark"><svg class="ic lg" style="color:#fff"><use href="#i-logo"/></svg></div>
    <h2>Grupo Talenth</h2>
    <p>Campus v1.7 · Modo estable local</p>
    <input type="tel" id="login-phone" placeholder="Celular (ej: 930175586)" inputmode="numeric">
    <input type="password" id="login-pin" placeholder="Clave (ej: 1234)" inputmode="numeric">
    <button id="btn-login">Ingresar</button>
    <div class="err" id="login-err"></div>
    <div class="help">Prueba: 930175586 / 1234</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><span class="mark"><svg class="ic" style="color:#fff"><use href="#i-logo"/></svg></span><span>GRUPO TALENTH</span></div>
    <div class="user-info"><span><b id="user-name">Usuario</b> · <span id="user-role">Rol</span></span>
    <button class="iconbtn" id="btn-logout"><svg class="ic"><use href="#i-logout"/></svg></button></div>
  </div>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="view"></main>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>(p?p+"-":"")+Math.random().toString(36).slice(2,8).toUpperCase();
const KEY='gt-campus-stable';
let S=null, currentUser=null;

// Datos de prueba
function seed(){
  return {
    students:[
      {id:"st-1",codigo:"GT-001",nombres:"Valeria",apellidos:"Rojas",dni:"76543210",edad:15,canal1:"51911111111",canal2:"51922222222",colegio:"I.E. Callao",distrito:"Callao",cumple:"2011-03-14",beca:{tipo:"total",pct:100}},
      {id:"st-2",codigo:"GT-002",nombres:"Diego",apellidos:"Ramos",dni:"76543211",edad:17,canal1:"51911111112",canal2:"51922222223",colegio:"I.E. Bellavista",distrito:"Bellavista",cumple:"2009-07-22",beca:null}
    ],
    groups:[
      {id:"g-1",nombre:"Teens · Sábados A",curso:"Inglés Básico",dias:[6],hi:"08:00",hf:"10:00",sede:"Callao",aula:"A-201",costo:180},
      {id:"g-2",nombre:"Adultos · Online A",curso:"Inglés Intermedio",dias:[1,3],hi:"19:00",hf:"21:00",sede:"Virtual",aula:"Teams",costo:180}
    ],
    enrollments:[{studentId:"st-1",groupId:"g-1",estado:"activa"},{studentId:"st-2",groupId:"g-1",estado:"activa"}],
    messages:[]
  };
}

function loadData(){
  try{
    const raw=localStorage.getItem(KEY);
    S = raw ? JSON.parse(raw) : seed();
    if(!raw) localStorage.setItem(KEY, JSON.stringify(S));
  }catch(e){ S=seed(); }
}

function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

function toast(msg){
  const t=document.createElement("div");t.className="toast ok";t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),3000);
}

// Login simple y garantizado
function doLogin(){
  const phone=$("#login-phone").value.trim();
  const pin=$("#login-pin").value.trim();
  const err=$("#login-err");
  err.textContent="";
  
  if(phone==="930175586" && pin==="1234"){
    currentUser={name:"Jhonnatan Giron",role:"super"};
  }else if(phone==="930175587" && pin==="1234"){
    currentUser={name:"Isabel Mendoza",role:"admin"};
  }else{
    err.textContent="Usa 930175586 / 1234 o 930175587 / 1234";
    return;
  }
  
  localStorage.setItem("gt_session", JSON.stringify(currentUser));
  enterApp();
}

function enterApp(){
  $("#login-screen").style.display="none";
  $("#app").style.display="block";
  $("#user-name").textContent=currentUser.name;
  $("#user-role").textContent=currentUser.role==="super"?"ADM Principal":"Administración";
  renderSidebar();
  route("#/home");
}

function checkSession(){
  const saved=localStorage.getItem("gt_session");
  if(saved){
    try{ currentUser=JSON.parse(saved); enterApp(); return; }catch(e){}
  }
  $("#login-screen").style.display="flex";
  $("#app").style.display="none";
}

function logout(){
  localStorage.removeItem("gt_session");
  currentUser=null;
  $("#app").style.display="none";
  $("#login-screen").style.display="flex";
  $("#login-phone").value="";$("#login-pin").value="";$("#login-err").textContent="";
}

const NAVS={
  super:[["home","Inicio","#/home"],["users","Estudiantes","#/users"],["cal","Grupos","#/groups"]],
  admin:[["home","Inicio","#/home"],["users","Estudiantes","#/users"],["cal","Grupos","#/groups"]]
};

function renderSidebar(){
  const nav=NAVS[currentUser.role]||NAVS.admin;
  $("#sidebar").innerHTML=`<div class="side-label">Menú</div>`+nav.map(n=>
    `<a class="side-link" href="${n[2]}" onclick="route('${n[2]}');return false;"><svg class="ic"><use href="#i-${n[0]}"/></svg>${n[1]}</a>`
  ).join("");
}

function route(hash){
  const view=$("#view");
  if(hash==="#/home"||hash==="#/"){
    view.innerHTML=`<div class="vh"><div><h1>Hola, ${esc(currentUser.name)} 👋</h1><div>Bienvenido al Campus Estable</div></div></div>
    <div class="grid g4">
      <div class="card"><div class="kpi"><div><div class="num">${S.students.length}</div><div class="lbl">Estudiantes</div></div></div></div>
      <div class="card"><div class="kpi"><div><div class="num">${S.groups.length}</div><div class="lbl">Grupos</div></div></div></div>
    </div>`;
  }else if(hash==="#/users"){
    view.innerHTML=`<div class="vh"><h1>Estudiantes</h1><button class="btn btn-p" onclick="toast('Función en desarrollo')">+ Nuevo</button></div>
    <div class="tw"><table><thead><tr><th>Código</th><th>Nombre</th><th>Distrito</th><th>Beca</th></tr></thead><tbody>
    ${S.students.map(s=>`<tr><td><b>${esc(s.codigo)}</b></td><td>${esc(s.nombres)} ${esc(s.apellidos)}</td><td>${esc(s.distrito)}</td><td>${s.beca?`<span class="badge b-green">Beca ${s.beca.pct}%</span>`:"Regular"}</td></tr>`).join("")}
    </tbody></table></div>`;
  }else if(hash==="#/groups"){
    view.innerHTML=`<div class="vh"><h1>Grupos</h1></div>
    <div class="grid g2">${S.groups.map(g=>`<div class="card"><h3>${esc(g.nombre)}</h3><div style="color:var(--muted);font-size:13px;margin:8px 0">${esc(g.curso)} · ${esc(g.sede)} · ${esc(g.aula)}</div><div style="font-size:12px">Sábados ${g.hi} - ${g.hf} · S/ ${g.costo}</div></div>`).join("")}</div>`;
  }
  
  // Actualizar clase activa en sidebar
  $$(".side-link").forEach(a=>{
    a.classList.toggle("on", a.getAttribute("href")===hash);
  });
}

// Event Listeners
$("#btn-login").addEventListener("click", doLogin);
$("#login-pin").addEventListener("keypress", e=>{ if(e.key==="Enter") doLogin(); });
$("#btn-logout").addEventListener("click", logout);

// Boot
loadData();
checkSession();
</script>
</body>
</html>
