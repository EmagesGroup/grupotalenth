<style>
:root{
--ink:#071a2c;--deep:#0b2b46;--ocean:#0e4d78;--primary:#0a84ff;--sky:#4cc3ff;
--accent:#ff3b5c;--amber:#ffb020;--green:#17b26a;--red:#f04438;--violet:#8b5cf6;--teal:#12b76a;
--paper:#eef4f9;--surface:#ffffff;--line:#d7e3ee;--muted:#5c7186;--text:#0f2438;--sand:#fff6e8;
--grad-hero:linear-gradient(135deg,#071a2c,#0e4d78 52%,#0a84ff 125%);
--grad-hot:linear-gradient(120deg,#ff3b5c,#ff8a3d);
--grad-cool:linear-gradient(120deg,#0a84ff,#12b76a);
--shadow:0 12px 34px rgba(7,26,44,.12);--r:16px;--nav:64px;--side:244px;
--fd:"Space Grotesk",system-ui;--fb:"Inter",system-ui}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--paper);color:var(--text);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background:radial-gradient(760px 360px at 92% -70px,rgba(10,132,255,.13),transparent 62%),
radial-gradient(620px 320px at -90px 42%,rgba(255,59,92,.08),transparent 60%),
radial-gradient(520px 300px at 62% 112%,rgba(18,183,106,.08),transparent 62%)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#e2ecf4}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--ocean),var(--primary));border-radius:9px;border:2px solid #e2ecf4}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.015em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
a{color:var(--primary);text-decoration:none}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.lg{width:24px;height:24px}
#login-screen{position:fixed;inset:0;z-index:200;background:var(--grad-hero);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:24px;padding:40px 30px;width:100%;max-width:400px;box-shadow:0 25px 50px rgba(0,0,0,.25);text-align:center}
.login-box .mark{width:64px;height:64px;border-radius:18px;background:var(--grad-hot);display:grid;place-items:center;margin:0 auto 20px;box-shadow:0 10px 25px rgba(255,59,92,.4)}
.login-box h2{font-size:24px;margin-bottom:8px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;margin-bottom:14px;text-align:center;letter-spacing:1px}
.login-box input:focus{outline:none;border-color:var(--primary)}
.login-box button{width:100%;padding:14px;border-radius:12px;border:0;background:var(--grad-hot);color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 20px rgba(255,59,92,.3)}
.login-box .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}
.login-box .help{margin-top:20px;font-size:11px;color:var(--muted)}
#app{display:none;min-height:100vh;position:relative;z-index:1}
.topbar{position:fixed;inset:0 0 auto;height:var(--nav);z-index:70;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(7,26,44,.95);backdrop-filter:blur(14px);color:#fff;border-bottom:1px solid rgba(76,195,255,.28)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:15px;white-space:nowrap}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--grad-hot);display:grid;place-items:center}
.brand small{display:block;font-size:9px;color:var(--sky);letter-spacing:.16em;text-transform:uppercase}
.net-badge{font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;background:rgba(255,176,32,.25);color:#ffd591;white-space:nowrap}
.net-badge.cloud{background:rgba(23,178,106,.28);color:#86efac}
.net-badge.err{background:rgba(240,68,56,.25);color:#ffb4ab}
.user-info{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#bcd3e8}
.user-info b{color:#fff}
.iconbtn{border:0;background:rgba(255,255,255,.11);color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;position:relative}
.layout{display:flex;padding-top:var(--nav)}
.sidebar{position:fixed;top:var(--nav);bottom:0;left:0;width:var(--side);background:var(--grad-hero);color:#cfe1f4;padding:16px 10px;overflow-y:auto;z-index:60}
.sidebar::-webkit-scrollbar-thumb{border-color:transparent;background:rgba(76,195,255,.45)}
.side-label{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#7fa6c8;padding:8px 12px 6px}
.side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:#cfe1f4;font-weight:600;font-size:13px;margin-bottom:2px}
.side-link:hover{background:rgba(255,255,255,.08);color:#fff}
.side-link.on{background:rgba(10,132,255,.28);color:#fff;box-shadow:inset 3px 0 0 var(--sky)}
.side-card{margin:14px 8px;padding:12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(76,195,255,.28);font-size:11px}
.side-card b{color:#fff}
.main{margin-left:var(--side);flex:1;min-width:0;padding:24px 26px 90px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.vh h1{font-size:25px;color:var(--ink)}
.vh .sub{color:var(--muted);font-size:13px;margin-top:2px}
.ha{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13px;transition:.18s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--grad-hot);color:#fff;box-shadow:0 8px 22px rgba(255,59,92,.32)}
.btn-b{background:var(--grad-cool);color:#fff}
.btn-g{background:var(--surface);color:var(--text);border:1px solid var(--line)}

.btn-d{background:rgba(240,68,56,.1);color:var(--red);border:1px solid rgba(240,68,56,.32)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;position:relative;overflow:hidden;margin-bottom:16px}
.stripe{position:absolute;inset:0 0 auto;height:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.kpi .num{font-family:var(--fd);font-size:26px;font-weight:700;color:var(--ink);line-height:1.1}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;border-radius:20px;padding:3px 10px}
.b-green{background:rgba(23,178,106,.14);color:var(--green)}
.b-amber{background:rgba(255,176,32,.18);color:#a35b00}
.b-red{background:rgba(240,68,56,.13);color:var(--red)}
.b-violet{background:rgba(139,92,246,.15);color:var(--violet)}
.b-blue{background:rgba(10,132,255,.13);color:var(--primary)}
.b-gray{background:#e7eef5;color:var(--muted)}
.tw{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:900px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:12px 14px;background:#f5f9fc;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--primary)}
td{padding:11px 14px;border-bottom:1px solid #edf3f8;font-size:13px;vertical-align:middle}

tbody tr:hover{background:#f3f9ff}
.avatar{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:220px}

.chip.on{background:var(--ocean);border-color:var(--ocean);color:#fff}
.chip.view{cursor:grab;border-style:dashed}
.chip.view.on{border-style:solid}
.bulkbar{display:none;align-items:center;gap:10px;background:var(--sand);border:1px solid #f0dfc2;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:600}
.bulkbar.on{display:flex}
.fi{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:#fbfdff}
textarea.fi{min-height:64px;resize:vertical}
label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
label .req{color:var(--red)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section-title{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--ink);margin:20px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}
.tutor-section{background:var(--sand);border:2px dashed var(--amber);border-radius:12px;padding:16px;margin-top:16px}
.tutor-badge{background:var(--amber);color:var(--ink);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block;margin-bottom:12px}
.note{font-size:12px;color:var(--muted);background:#f3f8fc;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.diag{font-family:ui-monospace,monospace;font-size:12px;background:var(--ink);color:#86efac;padding:12px;border-radius:10px;word-break:break-all}
.scrim{position:fixed;inset:0;background:rgba(7,26,44,.6);backdrop-filter:blur(4px);z-index:400;display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.scrim.on{display:flex}
.modal{background:#fff;border-radius:18px;max-width:760px;width:100%;box-shadow:0 26px 70px rgba(7,26,44,.25);animation:pop .22s ease}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:var(--grad-hero);color:#fff;border-radius:18px 18px 0 0}
.modal .m-body{padding:22px;max-height:70vh;overflow:auto}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#f8fafc;border-radius:0 0 18px 18px}
.x-btn{border:0;background:rgba(255,255,255,.16);color:#fff;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.drawer-scrim{position:fixed;inset:0;background:rgba(7,26,44,.42);z-index:380;display:none}
.drawer-scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:#fff;z-index:390;box-shadow:0 26px 70px rgba(7,26,44,.25);transform:translateX(100%);transition:.28s ease;overflow-y:auto;padding:22px}
.drawer.on{transform:none}
.dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{color:var(--text);font-weight:600;word-break:break-word}
#toasts{position:fixed;right:18px;bottom:20px;z-index:500;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 20px 50px rgba(7,26,44,.3);border-left:4px solid var(--green);animation:pop .25s ease}
.toast.warn{border-left-color:var(--amber)}
.toast.err{border-left-color:var(--red)}
.toast button{margin-left:auto;border:0;background:var(--grad-hot);color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px}
.empty{padding:34px;text-align:center;color:var(--muted)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .bl{width:150px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bt{flex:1;height:12px;background:#e8eef5;border-radius:8px;overflow:hidden}
.bar-row .bt i{display:block;height:100%;background:var(--grad-cool);border-radius:8px}
.bar-row .bn{width:36px;text-align:right;font-weight:800;font-size:12px}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:1080px){.g4,.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){.sidebar{display:none}.main{margin-left:0;padding:16px 14px 90px}.g2,.g3,.g4,.fgrid{grid-template-columns:1fr}.brand small{display:none}.user-info span:first-child{display:none}}
</style>

function migrate(data){

}

async function pullCloud(){

 if(!sb){try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){sbStatus="cliente: "+e.message;updateNet();return}}

 try{const{data,error}=await sb.from("campus_state").select("*").eq("id","main").single();
  if(error){sbStatus="nube rechazó: "+error.message;netMode="local"}
  else if(!data||!data.data){sbStatus="nube vacía → subiendo local";netMode="cloud";await push()}
  else{const cloudTs=new Date(data.updated_at).getTime();const localTs=S.meta.updatedAt||0;
   if(cloudTs>localTs){S=migrate(data.data);localStorage.setItem(KEY,JSON.stringify(S));lastRemote=cloudTs;sbStatus="ok · bajado de nube"}
   else{sbStatus="ok · local más reciente, subiendo";await push()}
   netMode="cloud";if(currentUser)route(location.hash||"#/home")}}
 catch(e){sbStatus="red: "+e.message;netMode="local"}updateNet()}

function toggleAll(on){filtered().slice(0,ui.limit).forEach(s=>on?ui.sel.add(s.id):ui.sel.delete(s.id));refreshTable()}
function bulkEstado(e){S.students.forEach(s=>{if(ui.sel.has(s.id))s.estado=e});ui.sel.clear();save();toast("Estado actualizado ✓");refreshTable()}
function bulkDelete(){const ids=[...ui.sel];undoBin={students:S.students.filter(s=>ids.includes(s.id)),enrollments:S.enrollments.filter(x=>ids.includes(x.studentId))};
 S.students=S.students.filter(s=>!ids.includes(s.id));S.enrollments=S.enrollments.filter(x=>!ids.includes(x.studentId));ui.sel.clear();save();refreshTable();
 toast(ids.length+" eliminados","warn",undoDelete)}
function delStudent(id){const s=S.students.find(x=>x.id===id);undoBin={students:[s],enrollments:S.enrollments.filter(x=>x.studentId===id)};
 S.students=S.students.filter(x=>x.id!==id);S.enrollments=S.enrollments.filter(x=>x.studentId!==id);save();refreshTable();toast("Estudiante eliminado","warn",undoDelete)}
function undoDelete(){if(!undoBin)return;S.students.push(...undoBin.students);S.enrollments.push(...undoBin.enrollments);undoBin=null;save();refreshTable();toast("Restaurado ✓")}
function saveView(){const name=prompt("Nombre de la vista:","Vista "+(S.views.length+1));if(!name)return;
 S.views.push({name,q:ui.q,estado:ui.estado,prog:ui.prog,cap:ui.cap,sort:ui.sort,dir:ui.dir});save();refreshTable();toast("Vista guardada ✓")}
function applyView(i){const v=S.views[i];if(!v)return;Object.assign(ui,{q:v.q,estado:v.estado,prog:v.prog,cap:v.cap,sort:v.sort,dir:v.dir,view:i,limit:25});vUsers()}
let dragI=null;function dragView(e,i){dragI=i}
function dropView(e,i){e.preventDefault();if(dragI===null||dragI===i)return;const v=S.views.splice(dragI,1)[0];S.views.splice(i,0,v);dragI=null;save();refreshTable()}

function saveStudent(id){
 const f=blankStudent();const ids=["dni","genero","nombres","apellidos","fechaNac","canal1","canal2","distrito","email","direccion","referencia","colegio","ocupacion","ultimoGrado","centroTrabajo","programa","nivel","track","modalidad","sede","turno","fechaMatricula","captacion","subCanal","asesor","fechaContacto","becaSel","formaPago","cicloFacturacion","alergias","tutorNombre","tutorDni","tutorRel","tutorTel","tutorEmail","estado","formFisico","fechaSalida","motivoSalida","obs"];
 ids.forEach(k=>{const el=$("#f-"+k);if(el)f[k]=el.value.trim()});
 const miss=REQ.filter(k=>!f[k]);if(miss.length){toast("Faltan "+miss.length+" campos obligatorios (*)","err");return}
 if(!/^\d{8}$/.test(f.dni)){toast("DNI debe tener 8 dígitos","err");return}
 if(!/^\d{9}$/.test(f.canal1)||!/^\d{9}$/.test(f.canal2)){toast("Celulares deben tener 9 dígitos","err");return}
 const edad=calcEdad(f.fechaNac);
 if(edad<18&&(!f.tutorNombre||!/^\d{8}$/.test(f.tutorDni)||!f.tutorRel||!/^\d{9}$/.test(f.tutorTel))){toast("Menor de edad: completa los 4 campos de tutor","err");return}
 const data=fromForm(f);
 if(id){const old=S.students.find(x=>x.id===id);data.id=id;data.codigo=old.codigo;data.createdAt=old.createdAt;Object.assign(old,data)}
 else{data.id=uid("st");data.codigo="GT-2026-"+String(S.students.length+1).padStart(3,"0");data.formFisico=f.formFisico||("F-"+String(S.students.length+1).padStart(3,"0"));S.students.push(data)}
 save();closeModal();toast(id?"Ficha actualizada ✓":"Estudiante registrado ✓");route(location.hash||"#/users")}

function openGroupForm(){
 $("#modal").innerHTML=`<header><h3>Nuevo grupo</h3><button class="x-btn" onclick="closeModal()">${icon("x")}</button></header><div class="m-body"><div class="fgrid">

function saveGroup(){const g=id=>$("#g-"+id).value.trim();
 const dias=g("dias").split(",").map(x=>+x.trim()).filter(x=>x>=0&&x<=6);
 if(!g("nombre")||!dias.length||toMin(g("hf"))<=toMin(g("hi"))){toast("Nombre, días y horario válidos requeridos","err");return}
 S.groups.push({id:uid("g"),nombre:g("nombre"),programa:g("programa"),nivel:g("nivel"),dias,hi:g("hi"),hf:g("hf"),sede:g("sede"),aula:g("aula"),costo:+g("costo")||0,docente:g("docente")});
 save();closeModal();toast("Grupo creado ✓");vGroups()}
function delGroup(id){const g=S.groups.find(x=>x.id===id);const ens=S.enrollments.filter(e=>e.groupId===id);
 undoBin={groups:[g],enrollments:ens};S.groups=S.groups.filter(x=>x.id!==id);S.enrollments=S.enrollments.filter(e=>e.groupId!==id);
 save();vGroups();toast("Grupo eliminado","warn",()=>{S.groups.push(...undoBin.groups);S.enrollments.push(...undoBin.enrollments);undoBin=null;save();vGroups()})}
function conflict(sid,gid){const g=S.groups.find(x=>x.id===gid);
 for(const e of S.enrollments.filter(e=>e.studentId===sid)){const o=S.groups.find(x=>x.id===e.groupId);if(!o)continue;
  if(g.dias.some(d=>o.dias.includes(d))&&toMin(g.hi)<toMin(o.hf)&&toMin(o.hi)<toMin(g.hf))return o}return null}
function openEnroll(gid){const g=S.groups.find(x=>x.id===gid);
 const avail=S.students.filter(s=>s.estado==="activo"&&!S.enrollments.some(e=>e.studentId===s.id&&e.groupId===gid));
 $("#modal").innerHTML=`<header><h3>Matricular en ${esc(g.nombre)}</h3><button class="x-btn" onclick="closeModal()">${icon("x")}</button></header><div class="m-body">
 <div class="note">${icon("shield")} El sistema bloquea matrículas con cruce de horario.</div>
 <label>Estudiante activo<select class="fi" id="e-sid">${avail.map(s=>`<option value="${s.id}">${esc(s.nombres)} ${esc(s.apellidos)} · ${esc(s.codigo)}</option>`).join("")||'<option value="">Sin estudiantes activos disponibles</option>'}</select></label>
 </div><footer><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="saveEnroll('${gid}')">${icon("check")} Matricular</button></footer>`;
 $("#scrim").classList.add("on")}
function saveEnroll(gid){const sid=$("#e-sid").value;if(!sid){toast("Selecciona un estudiante","err");return}
 const cf=conflict(sid,gid);if(cf){toast("CRUCE con "+cf.nombre+" ("+cf.hi+"–"+cf.hf+")","err");return}
 S.enrollments.push({id:uid("en"),studentId:sid,groupId:gid,estado:"activa"});save();closeModal();toast("Matriculado sin cruces ✓");vGroups()}
function unenroll(id){S.enrollments=S.enrollments.filter(e=>e.id!==id);save();vGroups();toast("Matrícula retirada")}

 const mes=new Date().getMonth()+1;const cump=act.filter(s=>s.fechaNac&&+s.fechaNac.split("-")[1]===mes);
 $("#view").innerHTML=`<div class="vh"><div><h1>Indicadores</h1><div class="sub">Solo estudiantes activos (${act.length}) · los inactivos no se procesan</div></div>
 <div class="ha"><button class="btn btn-g" onclick="exportCSV()">${icon("down")} CSV activos</button></div></div>
 <div class="grid g2">
 <div class="card"><div class="stripe" style="background:var(--grad-cool)"></div><h3 style="margin-bottom:12px">Captación</h3>${bars(Object.entries(cap).sort((a,b)=>b[1]-a[1]))}</div>
 <div class="card"><div class="stripe" style="background:var(--grad-hot)"></div><h3 style="margin-bottom:12px">Distritos</h3>${bars(Object.entries(dis).sort((a,b)=>b[1]-a[1]))}</div>
 <div class="card"><h3 style="margin-bottom:12px">Programas</h3>${bars(Object.entries(prog).sort((a,b)=>b[1]-a[1]))}</div>

function vBackup(){
 $("#view").innerHTML=`<div class="vh"><div><h1>Nube y respaldo</h1><div class="sub">Login local garantizado · nube como espejo · contingencia activa</div></div>
 <div class="ha"><button class="btn btn-g" onclick="pullCloud().then(()=>toast('Prueba terminada'))">🔁 Probar conexión</button><button class="btn btn-p" onclick="push().then(()=>toast('Subido ✓'))">☁ Subir ahora</button></div></div>
 <div class="grid g2">
 <div class="card"><h3 style="margin-bottom:10px">Diagnóstico</h3><div class="diag" id="diag">${esc(sbStatus)}</div><div style="margin-top:10px;font-size:13px">Modo: <b>${netMode==="cloud"?"☁ Nube":"📴 Local"}</b> · Estudiantes: <b>${S.students.length}</b> · Activos: <b>${S.students.filter(s=>s.estado==="activo").length}</b></div></div>
 <div class="card"><h3 style="margin-bottom:10px">Respaldo en papel + digital</h3><p style="font-size:13px;color:var(--muted);margin-bottom:12px">Exporta JSON para restaurar exacto, o CSV para Excel. El código F-XXX vincula cada ficha con tu archivo físico.</p>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-b" onclick="exportJSON()">${icon("down")} JSON</button><button class="btn btn-g" onclick="exportCSV()">${icon("down")} CSV</button><label class="btn btn-g" style="cursor:pointer">${icon("up")} Importar JSON<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"></label></div></div>
 <div class="card" style="grid-column:1/-1"><h3 style="margin-bottom:10px">Escala institucional</h3><p style="font-size:13px;color:var(--muted)">Por defecto solo se procesan <b>activos</b>. Inactivos, egresados y retirados quedan archivados y solo se consultan si los filtras. Cuando pases 1,000 activos, la paginación de 25 en 25 y los filtros mantienen la app rápida sin validar toda la base.</p></div>
 </div>`;updateNet()}
function download(name,content,type){const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function exportJSON(){download("campus-talenth-"+today()+".json",JSON.stringify(S,null,2),"application/json");toast("JSON descargado ✓")}
function exportCSV(){const rows=[["Codigo","DNI","Nombres","Apellidos","Edad","Genero","Canal1","Canal2","Distrito","Programa","Nivel","Track","Modalidad","Sede","Turno","Captacion","SubCanal","Beca","FormaPago","Estado","Alergias","Tutor","FormatoFisico"]];
 S.students.filter(s=>s.estado==="activo").forEach(s=>rows.push([s.codigo,s.dni,s.nombres,s.apellidos,calcEdad(s.fechaNac),s.genero,s.canal1,s.canal2,s.distrito,s.programa,s.nivel,s.track,s.modalidad,s.sede,s.turno,s.captacion,s.subCanal,s.beca?s.beca.pct+"%":"",s.formaPago,s.estado,s.alergias,s.tutor?s.tutor.nombre:"",s.formFisico]));
 download("estudiantes-activos-"+today()+".csv",rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv");toast("CSV descargado ✓")}
function importJSON(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.students)throw 0;S=migrate(d);save();toast("Importado ✓");route("#/home")}catch(e){toast("JSON inválido","err")}};r.readAsText(f)}

function toast(msg,type="ok",undo){const t=document.createElement("div");t.className="toast "+(type==="ok"?"":type);
 t.innerHTML=icon(type==="err"?"x":"check")+`<span>${esc(msg)}</span>`+(undo?`<button>Deshacer</button>`:"");
 if(undo)t.querySelector("button").onclick=()=>{undo();t.remove()};
 $("#toasts").appendChild(t);setTimeout(()=>t.remove(),undo?7000:3500)}

$("#btn-login").addEventListener("click",doLogin);
$("#login-pin").addEventListener("keypress",e=>{if(e.key==="Enter")doLogin()});
$("#btn-logout").addEventListener("click",logout);
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal()});
window.addEventListener("online",()=>pullCloud());
window.addEventListener("offline",()=>{netMode="local";sbStatus="sin internet · contingencia activa";updateNet()});
loadLocal();checkSession();pullCloud();
