<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Campus Grupo Talenth · v1.8b</title>
<meta name="theme-color" content="#071a2c">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--ink:#071a2c;--ocean:#0e4d78;--primary:#0a84ff;--accent:#ff3b5c;--green:#17b26a;--red:#f04438;--paper:#eef4f9;--surface:#fff;--line:#d7e3ee;--muted:#5c7186;--grad-hero:linear-gradient(135deg,#071a2c,#0e4d78 52%,#0a84ff 125%);--grad-hot:linear-gradient(120deg,#ff3b5c,#ff8a3d);--r:16px;--nav:64px;--side:240px;--fd:"Space Grotesk",system-ui;--fb:"Inter",system-ui}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.ic.lg{width:24px;height:24px}
#login-screen{position:fixed;inset:0;z-index:200;background:var(--grad-hero);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:24px;padding:40px 30px;width:100%;max-width:400px;box-shadow:0 25px 50px rgba(0,0,0,.25);text-align:center}
.login-box .mark{width:64px;height:64px;border-radius:18px;background:var(--grad-hot);display:grid;place-items:center;margin:0 auto 20px}
.login-box h2{font-family:var(--fd);font-size:24px;margin-bottom:8px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);font-size:16px;margin-bottom:14px;text-align:center}
.login-box button{width:100%;padding:14px;border-radius:12px;border:0;background:var(--grad-hot);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.login-box .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}
.login-box .help{margin-top:20px;font-size:11px;color:var(--muted)}
#app{display:none;min-height:100vh}
.topbar{position:fixed;inset:0 0 auto;height:var(--nav);z-index:70;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(7,26,44,.95);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:15px}.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--grad-hot);display:grid;place-items:center}
.net-badge{font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;background:rgba(255,176,32,.25);color:#ffd591;white-space:nowrap}.net-badge.cloud{background:rgba(23,178,106,.28);color:#86efac}.net-badge.err{background:rgba(240,68,56,.25);color:#ffb4ab}
.user-info{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#bcd3e8}.user-info b{color:#fff}
.iconbtn{border:0;background:rgba(255,255,255,.11);color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.layout{display:flex;padding-top:var(--nav)}
.sidebar{position:fixed;top:var(--nav);bottom:0;left:0;width:var(--side);background:var(--grad-hero);color:#cfe1f4;padding:16px 10px;overflow-y:auto}
.side-label{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#7fa6c8;padding:8px 12px 6px}
.side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:#cfe1f4;font-weight:600;font-size:13px;margin-bottom:2px;text-decoration:none}
.side-link.on{background:rgba(10,132,255,.28);color:#fff;box-shadow:inset 3px 0 0 var(--primary)}
.main{margin-left:var(--side);flex:1;padding:24px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}.vh h1{font-size:24px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer}.btn-p{background:var(--grad-hot);color:#fff}.btn-g{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn-sm{padding:6px 10px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi .num{font-family:var(--fd);font-size:26px;font-weight:700}.kpi .lbl{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800}.b-violet{background:rgba(139,92,246,.15);color:#8b5cf6}
.tw{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px;background:#f5f9fc;border-bottom:1px solid var(--line)}td{padding:12px;border-bottom:1px solid #edf3f8;font-size:13px}
.toast{position:fixed;right:18px;bottom:80px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;z-index:300;border-left:4px solid var(--green);animation:pop .3s ease}
.fi{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:14px}
label{font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.note{font-size:12px;color:var(--muted);background:#f3f8fc;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.diag{font-family:ui-monospace,monospace;font-size:12px;background:#071a2c;color:#86efac;padding:12px;border-radius:10px;word-break:break-all}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:860px){.sidebar{display:none}.main{margin-left:0;padding:16px}.g2,.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 3l7 8h-4v10H9V11H5l7-8z"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V11z"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.7-3.5 3.4-5.5 6.5-5.5s5.8 2 6.5 5.5M16 4.6a3.5 3.5 0 010 6.8"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M6 19a4 4 0 010-8 6 6 0 0111.3-2A4.5 4.5 0 0118 19H6z"/></symbol>
<symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
</svg>

<div id="login-screen">
  <div class="login-box">
    <div class="mark"><svg class="ic lg" style="color:#fff"><use href="#i-logo"/></svg></div>
    <h2>Grupo Talenth</h2>
    <p>Campus v1.8b · Entra siempre, sincroniza en la nube</p>
    <input type="tel" id="login-phone" placeholder="Celular (ej: 930175586)" inputmode="numeric">
    <input type="password" id="login-pin" placeholder="Clave (ej: 1234)" inputmode="numeric">
    <button id="btn-login">Ingresar</button>
    <div class="err" id="login-err"></div>
    <div class="help">Funciona sin internet. La nube es respaldo, no puerta.</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand"><span class="mark"><svg class="ic" style="color:#fff"><use href="#i-logo"/></svg></span><span>GRUPO TALENTH</span></div>
    <span class="net-badge" id="net-badge">⏳ Conectando…</span>
    <div class="user-info"><span><b id="user-name">Usuario</b> · <span id="user-role">Rol</span></span>
    <button class="iconbtn" id="btn-logout"><svg class="ic"><use href="#i-logout"/></svg></button></div>
  </div>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="view"></main>
  </div>
</div>

<div id="modal-bg" style="display:none;position:fixed;inset:0;background:rgba(7,26,44,.6);z-index:400;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto">
  <div style="background:#fff;border-radius:18px;max-width:640px;width:100%;padding:20px">
    <div style="display:flex;justify-content:space-between;margin-bottom:14px"><h3 id="modal-title">Nuevo estudiante</h3><button class="iconbtn" style="background:#eef4f9;color:#071a2c" onclick="closeModal()">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>(p?p+"-":"")+Math.random().toString(36).slice(2,8).toUpperCase();
const KEY='gt-campus-v18', SKEY='gt_session_v18';
const SB_URL='https://isnqfjwruqwqmzzmegci.supabase.co';
const SB_KEY='sb_publishable__h4NuoTLzZlU1nfEE4XKqg_I_RQDrlK';
const H1234='03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
const USERS=[
 {phone:'930175586',pin:H1234,role:'super',name:'Jhonnatan Giron'},
 {phone:'930175587',pin:H1234,role:'admin',name:'Isabel Mendoza'}
];
let S=null,currentUser=null,sb=null,netMode='local',sbStatus='esperando',pushTimer=null,lastRemote=0;

async function hashPin(p){const d=new TextEncoder().encode(p);const b=await crypto.subtle.digest('SHA-256',d);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}

function seed(){
 return {students:[
  {id:"st-1",codigo:"GT-001",nombres:"Valeria",apellidos:"Rojas Carmen",dni:"76543210",edad:15,canal1:"51911111111",canal2:"51922222222",captacion:"Visita a colegio",colegio:"I.E. Nuestra Señora del Carmen",direccion:"",distrito:"Callao",cumple:"2011-03-14",beca:{tipo:"total",pct:100}},
  {id:"st-2",codigo:"GT-002",nombres:"Diego",apellidos:"Ramos Silva",dni:"76543211",edad:17,canal1:"51911111112",canal2:"51922222223",captacion:"Campo / volanteo",colegio:"I.E. San Juan Bosco",direccion:"",distrito:"Bellavista",cumple:"2009-07-22",beca:null},
  {id:"st-3",codigo:"GT-003",nombres:"Lucía",apellidos:"Fernández Prado",dni:"76543212",edad:16,canal1:"51911111113",canal2:"51922222224",captacion:"Internet / Redes",colegio:"I.E. América Callao",direccion:"",distrito:"La Perla",cumple:"2010-11-02",beca:{tipo:"parcial",pct:50}},
  {id:"st-4",codigo:"GT-004",nombres:"Marco",apellidos:"Pérez Giron",dni:"76543213",edad:24,canal1:"51911111114",canal2:"51911111114",captacion:"Internet / Redes",colegio:"",direccion:"",distrito:"Los Olivos",cumple:"2002-05-30",beca:null},
  {id:"st-5",codigo:"GT-005",nombres:"Ana",apellidos:"Torres Vega",dni:"76543214",edad:19,canal1:"51911111115",canal2:"51922222226",captacion:"Referido",colegio:"",direccion:"",distrito:"Ventanilla",cumple:"2007-01-18",beca:null},
  {id:"st-6",codigo:"GT-006",nombres:"José",apellidos:"Chávez Rojas",dni:"76543215",edad:14,canal1:"51911111116",canal2:"51922222227",captacion:"Visita a colegio",colegio:"I.E. República de Venezuela",direccion:"",distrito:"Callao",cumple:"2012-09-09",beca:null}
 ],groups:[
  {id:"g-1",nombre:"Teens · Sábados A",curso:"Inglés Básico",dias:[6],hi:"08:00",hf:"10:00",sede:"Callao",aula:"A-201",costo:180},
  {id:"g-2",nombre:"Adultos · Online A",curso:"Inglés Intermedio",dias:[1,3,5],hi:"19:00",hf:"21:00",sede:"Virtual",aula:"Teams",costo:180}
 ],enrollments:[{studentId:"st-1",groupId:"g-1",estado:"activa"},{studentId:"st-2",groupId:"g-1",estado:"activa"}]};
}

function loadData(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):seed();if(!r)localStorage.setItem(KEY,JSON.stringify(S));}catch(e){S=seed();}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));if(sb){clearTimeout(pushTimer);pushTimer=setTimeout(push,700);}}
async function push(){if(!sb){sbStatus='sin librería';updateNet();return;}try{const {error}=await sb.from("campus_state").upsert({id:"main",data:S,updated_at:new Date().toISOString()});if(error){sbStatus='error al subir: '+error.message;netMode='local';}else{sbStatus='ok';netMode='cloud';lastRemote=Date.now();}updateNet();}catch(e){sbStatus='catch al subir: '+e.message;netMode='local';updateNet();}}

async function pullCloud(){
 if(!window.supabase){sbStatus='la librería Supabase NO cargó (revisa el <script> del CDN)';netMode='local';updateNet();return;}
 if(!sb){try{sb=window.supabase.createClient(SB_URL,SB_KEY);}catch(e){sbStatus='cliente falló: '+e.message;updateNet();return;}}
 sbStatus='probando…';updateNet();
 try{
  const {data,error}=await sb.from("campus_state").select("*").eq("id","main").single();
  if(error){sbStatus='nube rechazó: '+error.message;netMode='local';}
  else if(!data||!data.data){sbStatus='nube OK pero vacía → subiendo datos locales';netMode='cloud';await push();}
  else{lastRemote=new Date(data.updated_at).getTime();S=data.data;localStorage.setItem(KEY,JSON.stringify(S));netMode='cloud';sbStatus='ok';if(currentUser)route(location.hash||"#/home");}
 }catch(e){sbStatus='error de red: '+e.message;netMode='local';}
 updateNet();
}

function updateNet(){const b=$("#net-badge");if(!b)return;
 if(netMode==='cloud'){b.className='net-badge cloud';b.textContent='☁ Nube';}
 else{b.className='net-badge '+(sbStatus.startsWith('error')||sbStatus.startsWith('nube rechazó')||sbStatus.startsWith('catch')?'err':'');b.textContent='📴 Local';}
 const d=$("#diag");if(d)d.textContent=sbStatus;
}

async function doLogin(){
 const phone=$("#login-phone").value.trim(),pin=$("#login-pin").value.trim(),err=$("#login-err");
 err.textContent="";if(!phone||!pin){err.textContent="Completa celular y clave";return;}
 $("#btn-login").disabled=true;$("#btn-login").textContent="Verificando…";
 try{const h=await hashPin(pin);const u=USERS.find(x=>x.phone===phone&&x.pin===h);
  if(!u){err.textContent="Credenciales incorrectas";return;}
  currentUser=u;localStorage.setItem(SKEY,JSON.stringify(u));enterApp();
 }catch(e){err.textContent="Error: "+e.message;}
 finally{$("#btn-login").disabled=false;$("#btn-login").textContent="Ingresar";}
}
function enterApp(){$("#login-screen").style.display="none";$("#app").style.display="block";$("#user-name").textContent=currentUser.name;$("#user-role").textContent=currentUser.role==="super"?"ADM Principal":"Administración";renderSidebar();route("#/home");updateNet();}
function checkSession(){const s=localStorage.getItem(SKEY);if(s){try{currentUser=JSON.parse(s);enterApp();return}catch(e){}}$("#login-screen").style.display="flex";$("#app").style.display="none";}
function logout(){localStorage.removeItem(SKEY);currentUser=null;$("#app").style.display="none";$("#login-screen").style.display="flex";}

const NAVS={super:[["home","Inicio","#/home"],["users","Estudiantes","#/users"],["cal","Grupos","#/groups"],["cloud","Nube y respaldo","#/backup"]],admin:[["home","Inicio","#/home"],["users","Estudiantes","#/users"],["cal","Grupos","#/groups"]]};
function renderSidebar(){const nav=NAVS[currentUser.role]||NAVS.admin;$("#sidebar").innerHTML=`<div class="side-label">Menú</div>`+nav.map(n=>`<a class="side-link" href="${n[2]}" onclick="route('${n[2]}');return false;"><svg class="ic"><use href="#i-${n[0]}"/></svg>${n[1]}</a>`).join("");}

function route(hash){
 const view=$("#view");
 if(hash==="#/home"||hash==="#/"||!hash){
  view.innerHTML=`<div class="vh"><div><h1>Hola, ${esc(currentUser.name)} 👋</h1><div>Campus v1.8b · Estado: <b id="home-net">${netMode==='cloud'?'☁ Nube sincronizada':'📴 Local'}</b></div></div></div>
  <div class="grid g4">
   <div class="card"><div class="kpi"><div><div class="num">${S.students.length}</div><div class="lbl">Estudiantes</div></div></div></div>
   <div class="card"><div class="kpi"><div><div class="num">${S.groups.length}</div><div class="lbl">Grupos</div></div></div></div>
   <div class="card"><div class="kpi"><div><div class="num">${S.enrollments.length}</div><div class="lbl">Matrículas</div></div></div></div>
   <div class="card"><div class="kpi"><div><div class="num">${S.students.filter(s=>s.beca).length}</div><div class="lbl">Becados</div></div></div></div>
  </div>`;
 }else if(hash==="#/users"){renderUsers();}
 else if(hash==="#/groups"){
  view.innerHTML=`<div class="vh"><h1>Grupos</h1></div><div class="grid g2">${S.groups.map(g=>`<div class="card"><h3>${esc(g.nombre)}</h3><div style="color:var(--muted);font-size:13px;margin:8px 0">${esc(g.curso||'')} · ${esc(g.sede)} · ${esc(g.aula)}</div><div style="font-size:12px">${(g.dias||[]).map(d=>["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"][d]).join(", ")} ${g.hi}–${g.hf} · S/ ${g.costo}</div></div>`).join("")}</div>`;
 }else if(hash==="#/backup"){
  view.innerHTML=`<div class="vh"><h1>Nube y respaldo</h1><div style="display:flex;gap:8px"><button class="btn btn-g" onclick="pullCloud().then(()=>toast('Prueba terminada'))">🔁 Probar conexión</button><button class="btn btn-p" ${currentUser.role!=='super'?'disabled':''} onclick="push().then(()=>toast('Subido a la nube ✓'))">☁ Subir ahora</button></div></div>
  <div class="note">El login es <b>100% local</b>: nunca falla aunque caiga Supabase. La nube es respaldo y sincronización entre dispositivos. Si aquí ves "📴 Local", el botón "Probar conexión" te dirá el motivo exacto.</div>
  <div class="card"><h3 style="margin-bottom:10px">Diagnóstico en vivo</h3><div class="diag" id="diag">${esc(sbStatus)}</div><div style="margin-top:10px;font-size:13px">Modo: <b>${netMode==='cloud'?'☁ Nube':'📴 Local'}</b> · Estudiantes: <b>${S.students.length}</b></div></div>
  <div class="card"><h3 style="margin-bottom:10px">Prueba de contingencia (recomendada)</h3><p style="font-size:13px;color:var(--muted)">Apaga tu WiFi, recarga la página e ingresa con tu celular y PIN. Debes entrar igual y poder crear estudiantes. Al encender el WiFi, pulsa "Subir ahora" y verás ☁ Nube. Eso demuestra que una contingencia no te deja afuera.</p></div>`;
  updateNet();
 }
 $$(".side-link").forEach(a=>a.classList.toggle("on",a.getAttribute("href")===hash));
}

const CAPS=["Campo / volanteo","Visita a colegio","Internet / Redes","Referido","Convenio","WhatsApp entrante"];
function openStudentForm(id){
 const s=id?S.students.find(x=>x.id===id):{nombres:"",apellidos:"",dni:"",edad:"",cumple:"",captacion:"",colegio:"",direccion:"",distrito:"",canal1:"",canal2:"",beca:null};
 $("#modal-title").textContent=id?"Editar estudiante":"Nuevo estudiante";
 $("#modal-body").innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <label>Nombres<input class="fi" id="f-nom" value="${esc(s.nombres)}"></label>
  <label>Apellidos<input class="fi" id="f-ape" value="${esc(s.apellidos)}"></label>
  <label>DNI<input class="fi" id="f-dni" value="${esc(s.dni)}"></label>
  <label>Edad<input class="fi" id="f-edad" type="number" value="${s.edad||''}"></label>
  <label>Cumpleaños<input class="fi" id="f-cumple" type="date" value="${esc(s.cumple)}"></label>
  <label>Captación<select class="fi" id="f-cap"><option value="">—</option>${CAPS.map(c=>`<option ${s.captacion===c?"selected":""}>${c}</option>`).join("")}</select></label>
  <label>Colegio<input class="fi" id="f-col" value="${esc(s.colegio)}"></label>
  <label>Distrito<input class="fi" id="f-dist" value="${esc(s.distrito)}"></label>
  <label>Dirección<input class="fi" id="f-dir" value="${esc(s.direccion)}"></label>
  <label>Canal 1 (estudiante)<input class="fi" id="f-c1" value="${esc(s.canal1)}"></label>
  <label>Canal 2 (tutor)<input class="fi" id="f-c2" value="${esc(s.canal2)}"></label>
  <label>Beca<select class="fi" id="f-beca"><option value="">Sin beca</option><option value="total" ${s.beca&&s.beca.tipo==="total"?"selected":""}>Total 100%</option><option value="parcial" ${s.beca&&s.beca.tipo==="parcial"?"selected":""}>Parcial 50%</option></select></label>
 </div>
 <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-g" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="saveStudent('${id||""}')">Guardar</button></div>`;
 $("#modal-bg").style.display="flex";
}
function closeModal(){$("#modal-bg").style.display="none";}
function saveStudent(id){
 const g=x=>$("#"+x).value.trim();
 if(!g("f-nom")||!g("f-ape")){toast("Nombres y apellidos son obligatorios");return;}
 const data={nombres:g("f-nom"),apellidos:g("f-ape"),dni:g("f-dni"),edad:+g("f-edad")||0,cumple:g("f-cumple"),captacion:g("f-cap"),colegio:g("f-col"),distrito:g("f-dist"),direccion:g("f-dir"),canal1:g("f-c1"),canal2:g("f-c2"),beca:g("f-beca")?{tipo:g("f-beca"),pct:g("f-beca")==="total"?100:50}:null};
 if(id){Object.assign(S.students.find(x=>x.id===id),data);}else{data.id=uid("st");data.codigo="GT-"+String(S.students.length+1).padStart(3,"0");S.students.push(data);}
 save();closeModal();toast(id?"Actualizado ✓":"Estudiante registrado ✓");renderUsers();
}
function delStudent(id){if(confirm("¿Eliminar este estudiante?")){S.students=S.students.filter(x=>x.id!==id);S.enrollments=S.enrollments.filter(e=>e.studentId!==id);save();toast("Eliminado");renderUsers();}}
function renderUsers(){
 $("#view").innerHTML=`<div class="vh"><h1>Estudiantes</h1><button class="btn btn-p" onclick="openStudentForm()">+ Nuevo estudiante</button></div>
 <div class="tw"><table><thead><tr><th>Código</th><th>Nombre</th><th>Captación</th><th>Colegio</th><th>Distrito</th><th>Cumple</th><th>Beca</th><th></th></tr></thead><tbody>
 ${S.students.map(s=>`<tr><td><b>${esc(s.codigo)}</b></td><td>${esc(s.nombres)} ${esc(s.apellidos)}</td><td>${esc(s.captacion||"—")}</td><td>${esc(s.colegio||"—")}</td><td>${esc(s.distrito||"—")}</td><td>${s.cumple?esc(s.cumple):"—"}</td><td>${s.beca?`<span class="badge b-violet">${s.beca.pct}%</span>`:"Regular"}</td><td><button class="btn btn-g btn-sm" onclick="openStudentForm('${s.id}')">✎</button> <button class="btn btn-g btn-sm" style="color:var(--red)" onclick="delStudent('${s.id}')">🗑</button></td></tr>`).join("")||`<tr><td colspan="8" style="text-align:center;color:var(--muted)">Sin estudiantes.</td></tr>`}
 </tbody></table></div>`;
}

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}

$("#btn-login").addEventListener("click",doLogin);
$("#login-pin").addEventListener("keypress",e=>{if(e.key==="Enter")doLogin();});
$("#btn-logout").addEventListener("click",logout);
window.addEventListener("online",()=>{pullCloud();});
window.addEventListener("offline",()=>{netMode='local';sbStatus='sin internet (modo contingencia activo)';updateNet();});

loadData();
checkSession();
pullCloud();
</script>
