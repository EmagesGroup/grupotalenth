async function findUser(phone,pinHash){
  // 1) nube
  if(sb){try{const {data,error}=await sb.from("users").select("*").eq("phone",phone).eq("active",true).single();if(!error&&data){if(data.pin_hash===pinHash)return data;}}catch(e){}}

  const u=localUsers().find(x=>x.phone===phone&&x.pin_hash===pinHash);

/* ===== DATA LOAD (con timeout de contingencia) ===== */
async function loadData(){
  const cloud=fetchCloud().then(d=>({src:'cloud',d})).catch(e=>({src:'err',e}));
  const timeout=new Promise(r=>setTimeout(()=>r({src:'timeout'}),4000));
  const res=await Promise.race([cloud,timeout]);
  if(res.src==='cloud'&&res.d){S=res.d;netMode='cloud';localStorage.setItem(KEY,JSON.stringify(S));}
  else{
    netMode='local';
    try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);return}}catch(e){}
    S=seed();saveLocal();
  }
}
async function fetchCloud(){const {data,error}=await sb.from("campus_state").select("*").eq("id","main").single();if(error||!data)throw error||new Error("empty");return data.data;}

    const h=await hashPin(pin);

    if(!u){err.textContent="Credenciales incorrectas";return;}
    currentUser=u;localStorage.setItem(SKEY,JSON.stringify(u));

utor?.nombre||"")}"></div><div class="field"><label>DNI tutor</label><input name="tutorDni" value="${esc(e.tutor?.dni||"")}"></div></div><div class="field"><label>Beca (solo mensualidad)</label><select name="beca"><option value="">Sin beca</option><option value="total" ${e.beca?.tipo==="total"?"selected":""}>Total 100%</option><option value="parcial" ${e.beca?.tipo==="parcial"?"selected":""}>Parcial 50%</option></select></div><label class="check"><input type="checkbox" name="consent" required ${s?"checked":""}><span><b>Consentimiento v1.3:</b> autorizo tratamiento de datos (Ley 29733) y reportes a los dos canales.</span></label></form>`;}

function vPagos(){return head("Pagos","Vouchers Yape/Plin · beca cubre solo mensualidad.",`<button class="btn btn-p" data-action="gen-month">${icon("cash")} Generar cuotas del mes</button>`)+`<div class="note" style="margin-bottom:14px">${icon("alert")} <b>¿Qué hace "Generar cuotas del mes"?</b> Crea recibos pendientes para matriculados activos según costo del grupo. <b>No cobra ni envía WhatsApp</b>: solo prepara recibos para validar vouchers. Becados: S/ 0 o parcial. FUT se cobran aparte.</div><div class="tw"><table><thead><tr><th>Estudiante</th><th>Concepto</th><th>Monto</th><th>Vence</th><th>Estado</th><th></th></tr></thead><tbody>${S.payments.map(p=>`<tr><td>${esc(student(p.studentId)?.nombres||"")}</td><td>${badge(p.concepto,"blue")}</td><td><b>${money(p.monto)}</b></td><td>${fdate(p.vencimiento)}</td><td>${payBadge(p.estado)}</td><td>${p.estado==="validacion"?`<button class="btn btn-ok btn-sm" data-action="pay-ok" data-id="${p.id}">${icon("check")} Validar</button>`:["pendiente","por_vencer","vencido"].includes(p.estado)?`<button class="btn btn-g btn-sm" data-action="pay-mark" data-id="${p.id}">${icon("check")} Pagado</button>`:""}</td></tr>`).join("")}</tbody></table></div>`;}

function vRespaldo(){return head("Respaldo Excel","Exporta todo. Si el sistema cae, el Excel conserva la info.",`<button class="btn btn-p" data-action="export-xlsx">${icon("down")} Descargar Excel</button>`)+`<div class="grid g2"><div class="card"><div class="stripe" style="background:var(--grad-cool)"></div><h3 style="margin-bottom:8px">Excel legible</h3><p style="font-size:13px;color:var(--muted);margin-bottom:12px">Un .xlsx con hoja por tabla: Estudiantes (con captación, colegio, distrito, cumpleaños), Matrículas, Facultades, Programas, Cursos, Módulos, Grupos, Sesiones, Asistencia, FUT, Pagos, Tarifario, Justificantes, Captación, Mensajes, Certificados, Auditoría.</p><button class="btn btn-b" data-action="export-xlsx">${icon("down")} Exportar .xlsx</button></div><div class="card"><div class="stripe" style="background:var(--grad-hot)"></div><h3 style="margin-bottom:8px">Restauración JSON</h3><p style="font-size:13px;color:var(--muted);margin-bottom:12px">Para restaurar exactamente igual, usa el JSON. Guárdalo junto al Excel.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-g" data-action="export-json">${icon("down")} Exportar JSON</button><label class="btn btn-g" style="cursor:pointer">${icon("up")} Importar JSON<input type="file" accept=".json" id="import-json" style="display:none"></label></div></div><div class="card" style="grid-column:1/-1"><h3 style="margin-bottom:8px">Modo contingencia</h3><p style="font-size:13px;color:var(--muted)">Si Supabase se cae o no hay internet, la app sigue funcionando con el último respaldo local y los accesos locales. Al recuperar conexión, sincroniza sola. Estado actual: <b>${netMode==='cloud'?'☁ Nube':'📴 Local'+(pendingSync?' (cambios pendientes)':'')}</b>. <button class="btn btn-g btn-sm" data-action="force-sync">${icon("cloud)} Sincronizar ahora</button></p></div></div>`;}
function vConfig(){return head("Configuración","Parámetros + estado de conexión.",``)+`<div class="grid g2"><div class="card"><h3 style="margin-bottom:12px">Notificaciones</h3><div class="field"><label>WhatsApp dedicado</label><input class="ctl" id="cfg-number" value="${esc(S.config.notifyNumber)}" style="width:100%"></div><div class="field"><label>Hora de corte</label><input class="ctl" id="cfg-cutoff" type="number" value="${S.config.cutoffHour}" style="width:100%"></div><div class="field"><label>Correo</label><input class="ctl" id="cfg-email" value="${esc(S.config.email)}" style="width:100%"></div><button class="btn btn-b" data-action="save-config">${icon("check")} Guardar</button></div><div class="card"><h3 style="margin-bottom:12px">Conexión y contingencia</h3><div class="note" style="margin-bottom:12px">URL y key van <b>hardcodeadas</b> en el código: nadie las pega. Si la nube falla, la app entra en modo local automáticamente y sincroniza al recuperar red.</div><div class="field"><label>Estado</label><div><span class="net-badge ${netMode==='cloud'?'cloud':'off'}">${netMode==='cloud'?'☁ Nube activa':'📴 Local'+(pendingSync?' (pendiente)':'')}</span></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-b" data-action="force-sync">${icon("cloud")} Forzar sincronización</button><button class="btn btn-g" data-action="add-user">${icon("plus")} Crear acceso</button></div></div><div class="card"><h3 style="margin-bottom:12px">Auditoría</h3>${S.audit.slice(0,6).map(a=>`<div style="font-size:12px;padding:6px 0;border-bottom:1px solid #edf3f8"><b>${esc(a.accion)}</b> · ${esc(a.user)}<div style="color:var(--muted)">${esc(a.detalle)}</div></div>`).join("")||"Sin registros."}</div><div class="card"><h3 style="margin-bottom:12px">Demo</h3><button class="btn btn-d" data-action="reset-demo">${icon("undo")} Restablecer datos</button></div></div>`;}

ton class="btn btn-g" data-action="fut-change" data-id="${seid}">${icon("fut")} Cambio con FUT</button>`:""}`}</div>`;}

/* ===== ROUTER ===== */
function route(){
  if(!currentUser)return;
  const h=location.hash||"#/"+currentUser.role;
  const p=h.replace("#/","").split("/");
  if(p[0]==="verificar"){shell(vVerify(p[1]||""),h);bindDynamic();return;}
  if(p[0]==="checkin"){if(currentUser.role==="estudiante")doCheckin(p[1]);location.hash="#/est";return;}
  const role=p[0];
  if(role!==currentUser.role&&role!=="publico"){location.hash="#/"+currentUser.role;return;}
  let c="";
  if(role==="publico")c=vPublic();
  else if(role==="super"||role==="admin"){const map={indicadores:vIndicadores,estudiantes:vEstudiantes,captacion:vCaptacion,estructura:vEstructura,grupos:vGrupos,sesiones:vSesiones,fut:vFut,tarifario:vTarifario,justificantes:vJustificantes,pagos:vPagos,certificados:vCertificados,reportes:vReportes,mensajes:vMensajes,respaldo:vRespaldo,config:vConfig};const superOnly=["captacion","estructura","tarifario","justificantes","respaldo","config"];if(role==="admin"&&superOnly.includes(p[1]))c=`<div class="card"><div class="empty">${icon("shield")}<br>Sección exclusiva del ADM principal.</div></div>`;else c=(map[p[1]]||vDash)();}
  else if(role==="docente")c=p[1]==="sesion"?vDocSesion(p[2]):p[1]==="grupos"?vDocGrupos():p[1]==="actividades"?vDocActividades():p[1]==="avisos"?vDocAvisos():vDocHoy();
  else if(role==="tutor")c=p[1]==="pagos"?vEstPagos():p[1]==="alertas"?vEstAlertas():vTutor();
  else c=p[1]==="cursos"?vEstCursos():p[1]==="curso"?vEstCurso(p[2]):p[1]==="aula"?vEstAula(p[2]):p[1]==="pagos"?vEstPagos():p[1]==="alertas"?vEstAlertas():p[1]==="perfil"?vEstPerfil():p[1]==="fut"?vEstFut():vEstInicio();
  shell(c,h);bindDynamic();
}
function render(){save();route();}
function doCheckin(seid){const sid=ui.student,se=session(seid);if(!se||!enrolledIn(sid,seid)){toast("No matriculado.","err");return;}if(attFor(seid,sid)){toast("Ya registraste check-in.","warn");return;}const diff=nowMin()-toMin(se.hi),est=diff<=15?"P":diff<=30?"T":"F";S.attendance.push({id:uid("at"),sessionId:seid,studentId:sid,estado:est,nota:est==="F"?0:null,notaOrigen:est==="F"?"ausencia":null,checkin:{ts:Date.now(),metodo:group(se.groupId).modalidad==="Online"?"link":"qr"},history:[]});audit("Check-in",sid);toast(est==="P"?"PRESENTE ✓":est==="T"?"TARDANZA":"Fuera de ventana: FALTA");render();}
function bindDynamic(){const q=$("#est-q");if(q)q.oninput=()=>{ui.estQ=q.value;const l=estRows();$("#est-tbody").innerHTML=estBody(l);$("#est-count").textContent=l.length+" registros";};$$(".opt").forEach(o=>o.onclick=()=>{o.parentElement.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));o.classList.add("sel");});}

function exportIndicadores(){const st=S.students;const byCap=S.captacion.map(c=>({Canal:c.nombre,Estudiantes:st.filter(s=>s.captacionId===c.id).length}));const col={};st.forEach(s=>{if(s.colegio)col[s.colegio]=(col[s.colegio]||0)+1});const dis={};st.forEach(s=>{if(s.distrito)dis[s.distrito]=(dis[s.distrito]||0)+1});const mes=new Date().getMonth()+1;const cump=st.filter(s=>s.cumple&&+s.cumple.split("-")[1]===mes).map(s=>({Dia:+s.cumple.split("-")[2],Estudiante:s.nombres+" "+s.apellidos,Distrito:s.distrito||"",Canal:captacion(s.captacionId)?.nombre||""}));if(window.XLSX){const wb=XLSX.utils.book_new();[["Captacion",byCap],["Colegios",Object.entries(col).map(([k,v])=>({Colegio:k,Estudiantes:v}))],["Distritos",Object.entries(dis).map(([k,v])=>({Distrito:k,Estudiantes:v}))],["CumplesMes",cump]].forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.length?d:[{Info:"Sin datos"}]),n));XLSX.writeFile(wb,"indicadores-"+today()+".xlsx");toast("Indicadores ✓");}else toast("XLSX no disponible.","err");}

if(a==="new-fut"||a==="new-fut-st"){const isSt=a==="new-fut-st";openModal("Nuevo FUT",`<form id="frm-fut">${isSt?`<input type="hidden" name="sid" value="${ui.student}">`:`<div class="field"><label>Estudiante</label><select name="sid">${S.students.map(s=>`<option value="${s.id}">${esc(s.nombres)} ${esc(s.apellidos)}</option>`).join("")}</select></div>`}<div class="field"><label>Justificante</label><select name="justificanteId">${S.justificantes.filter(j=>j.activo).map(j=>`<option value="${j.id}">${esc(j.nombre)} · ${money(j.arancel)}</option>`).join("")}</select></div><div class="field"><label>Sesión</label><select name="sessionId"><option value="">—</option>${S.sessions.map(s=>`<option value="${s.id}">${esc(group(s.groupId).nombre)} · ${fdate(s.fecha)}</option>`).join("")}</select></div><div class="field"><label>Detalle/sustento</label><textarea name="detalle" required></textarea></div></form>`,`<button class="btn btn-g" data-action="close-modal">Cancelar</button><button class="btn btn-p" data-action="submit-fut">${icon("check")} Generar</button>`);return;}
if(a==="submit-fut"){const f=$("#frm-fut");if(!f.reportValidity())return;const fd=new FormData(f),j=justificante(fd.get("justificanteId")),code="GT-FUT-2026-"+String(100+S.futs.length+1).padStart(6,"0");const fut={id:uid("f"),codigo:code,studentId:fd.get("sid"),justificanteId:j.id,tipo:j.nombre,sessionId:fd.get("sessionId")||null,detalle:fd.get("detalle"),arancel:j.arancel,estado:j.arancel?"pago_pendiente":"recibido",creadoEn:Date.now(),conformeEn:null,usadoEn:null};S.futs.unshift(fut);if(j.arancel)S.payments.unshift({id:uid("py"),studentId:fut.studentId,concepto:"fut",refId:fut.id,monto:j.arancel,vencimiento:addDays(today(),5),estado:"pendiente",voucher:null,pagadoEn:null});audit("FUT",code);closeModal();toast("FUT "+code+".");render();return;}
if(a==="fut-conform"){const f=S.futs.find(x=>x.id===id);f.estado="conforme";f.conformeEn=Date.now();const pay=S.payments.find(p=>p.refId===f.id);if(pay)pay.estado="pagado";queueMsg("fut",f.studentId,"1","Tu FUT "+f.codigo+" está CONFORME. Entrégalo a tu docente (7 días).");audit("FUT conforme",f.codigo);toast("Conforme ✓");render();return;}
if(a==="new-tarifa"||a==="edit-tarifa"){if(!guardSuper())return;const t=a==="edit-tarifa"?S.tarifario.find(x=>x.id===id):{concepto:"",aplica:"General",monto:0,vigencia:"2026",activo:true};openModal(a==="edit-tarifa"?"Editar":"Nuevo concepto",`<form id="frm-tarifa" data-id="${t.id||""}"><div class="field"><label>Concepto</label><input name="concepto" required value="${esc(t.concepto)}"></div><div class="frow"><div class="field"><label>Aplica a</label><input name="aplica" value="${esc(t.aplica)}"></div><div class="field"><label>Monto S/</label><input name="monto" type="number" step="0.01" value="${t.monto}" required></div></div><div class="frow"><div class="field"><label>Vigencia</label><input name="vigencia" value="${esc(t.vigencia)}"></div><div class="field"><label>Estado</label><select name="activo"><option value="1" ${t.activo?"selected":""}>Activo</option><option value="0" ${!t.activo?"selected":""}>Inactivo</option></select></div></div></form>`,`<button class="btn btn-g" data-action="close-modal">Cancelar</button><button class="btn btn-p" data-action="submit-tarifa">${icon("check")} Guardar</button>`);return;}
if(a==="submit-tarifa"){if(!guardSuper())return;const f=$("#frm-tarifa");if(!f.reportValidity())return;const fd=new FormData(f),data={concepto:fd.get("concepto"),aplica:fd.get("aplica"),monto:+fd.get("monto"),vigencia:fd.get("vigencia"),activo:fd.get("activo")==="1"};const tid=f.dataset.id;if(tid)Object.assign(S.tarifario.find(x=>x.id===tid),data);else S.tarifario.push({id:uid("t"),...data});audit("Tarifario",data.concepto);closeModal();toast("Guardado.");render();return;}

if(a==="new-just"||a==="edit-just"){if(!guardSuper())return;const j=a==="edit-just"?S.justificantes.find(x=>x.id===id):{codigo:"",nombre:"",requiereSustento:true,arancel:0,activo:true};openModal(a==="edit-just"?"Editar":"Nuevo justificante",`<form id="frm-just" data-id="${j.id||""}"><div class="frow"><div class="field"><label>Código</label><input name="codigo" required value="${esc(j.codigo)}"></div><div class="field"><label>Arancel S/</label><input name="arancel" type="number" step="0.01" value="${j.arancel}" required></div></div><div class="field"><label>Nombre</label><input name="nombre" required value="${esc(j.nombre)}"></div><label class="check"><input type="checkbox" name="sustento" ${j.requiereSustento?"checked":""}><span>Requiere sustento</span></label><div class="field" style="margin-top:10px"><label>Estado</label><select name="activo"><option value="1" ${j.activo?"selected":""}>Activo</option><option value="0" ${!j.activo?"selected":""}>Inactivo</option></select></div></form>`,`<button class="btn btn-g" data-action="close-modal">Cancelar</button><button class="btn btn-p" data-action="submit-just">${icon("check")} Guardar</button>`);return;}
if(a==="submit-just"){if(!guardSuper())return;const f=$("#frm-just");if(!f.reportValidity())return;const fd=new FormData(f),data={codigo:fd.get("codigo").toUpperCase(),nombre:fd.get("nombre"),requiereSustento:fd.get("sustento")==="on",arancel:+fd.get("arancel"),activo:fd.get("activo")==="1"};const jid=f.dataset.id;if(jid)Object.assign(S.justificantes.find(x=>x.id===jid),data);else S.justificantes.push({id:uid("j"),...data});audit("Justificante",data.nombre);closeModal();toast("Guardado.");render();return;}
if(a==="del-just"){if(!guardSuper())return;const j=S.justificantes.find(x=>x.id===id),idx=S.justificantes.indexOf(j);S.justificantes.splice(idx,1);toast("Eliminado.","warn",()=>S.justificantes.splice(idx,0,j));render();return;}
if(a==="gen-month"){const active=S.enrollments.filter(e=>e.estado==="activa");const newOnes=active.filter(e=>!S.payments.some(p=>p.studentId===e.studentId&&p.concepto==="mensualidad"&&p.refId===e.groupId&&p.vencimiento>=today()));const total=newOnes.reduce((sum,e)=>{const st=student(e.studentId),g=group(e.groupId);return sum+(st.beca?(st.beca.tipo==="total"?0:g.costo*(1-st.beca.pct/100)):g.costo);},0);openModal("Generar cuotas del mes",`<div class="note" style="margin-bottom:12px">${icon("alert")} No cobra ni envía WhatsApp. Solo crea recibos pendientes.</div><div class="grid g3"><div class="card"><div class="kpi"><div><div class="num">${newOnes.length}</div><div class="lbl">Cuotas nuevas</div></div></div></div><div class="card"><div class="kpi"><div><div class="num">${active.length-newOnes.length}</div><div class="lbl">Ya existentes</div></div></div></div><div class="card"><div class="kpi"><div><div class="num">${money(total)}</div><div class="lbl">Total</div></div></div></div></div>`,`<button class="btn btn-g" data-action="close-modal">Cancelar</button><button class="btn btn-p" data-action="confirm-gen-month">${icon("check")} Crear ${newOnes.length}</button>`);return;}
if(a==="confirm-gen-month"){let n=0;S.enrollments.filter(e=>e.estado==="activa").forEach(e=>{const st=student(e.studentId);if(S.payments.some(p=>p.studentId===e.studentId&&p.concepto==="mensualidad"&&p.refId===e.groupId&&p.vencimiento>=today()))return;const g=group(e.groupId),monto=st.beca?(st.beca.tipo==="total"?0:g.costo*(1-st.beca.pct/100)):g.costo;S.payments.push({id:uid("py"),studentId:e.studentId,concepto:"mensualidad",refId:e.groupId,monto,vencimiento:addDays(today(),7),estado:st.beca?"beca":"pendiente",voucher:null,pagadoEn:null});n++;});audit("Cuotas",n);closeModal();toast(n?n+" recibos.":"Sin cuotas nuevas.");render();return;}
if(a==="pay-ok"){const p=S.payments.find(x=>x.id===id);p.estado="pagado";p.pagadoEn=Date.now();audit("Voucher validado",p.id);toast("Conforme.");render();return;}

if(a==="emit-cert"){const en=S.enrollments.find(x=>x.id===el.dataset.en),r=record(en.studentId,en.groupId);if(!r.habilitado){toast("No habilitado.","err");return;}const code="GT-CERT-2026-"+uid(),c={id:uid("ce"),codigo:code,studentId:en.studentId,groupId:en.groupId,emitidoEn:Date.now(),snapshot:{prom:r.prom,pct:r.pct,faltas:r.faltas}};S.certificates.push(c);audit("Certificado",code);toast("Emitido ✓");render();openCert(c);return;}

if(a==="save-config"){if(!guardSuper())return;S.config.notifyNumber=$("#cfg-number").value.replace(/\D/g,"");S.config.cutoffHour=+$("#cfg-cutoff").value;S.config.email=$("#cfg-email").value;toast("Guardado.");render();return;}
if(a==="add-user"){if(!guardSuper())return;openModal("Crear acceso (celular + PIN)",`<form id="frm-user"><div class="frow"><div class="field"><label>Celular *</label><input name="phone" required placeholder="930175586" inputmode="numeric"></div><div class="field"><label>Nombre *</label><input name="name" required></div></div><div class="frow"><div class="field"><label>Rol *</label><select name="role"><option value="admin">Admin</option><option value="docente">Docente</option><option value="estudiante">Estudiante</option><option value="tutor">Tutor</option></select></div><div class="field"><label>PIN inicial *</label><input name="pin" required value="1234" maxlength="6" inputmode="numeric"></div></div><div class="note">Se guarda en la nube Y en local (contingencia). El usuario puede cambiar su PIN al entrar.</div></form>`,`<button class="btn btn-g" data-action="close-modal">Cancelar</button><button class="btn btn-p" data-action="submit-user">${icon("check")} Crear</button>`);return;}
if(a==="submit-user"){if(!guardSuper())return;const f=$("#frm-user");if(!f.reportValidity())return;const fd=new FormData(f),phone=fd.get("phone").replace(/\D/g,""),h=await hashPin(fd.get("pin"));const u={phone,pin_hash:h,role:fd.get("role"),name:fd.get("name"),active:true};if(sb){const {error}=await sb.from("users").insert(u);if(error)toast("Nube falló: "+error.message,"warn");}const loc=localUsers();const ex=loc.findIndex(x=>x.phone===phone);if(ex>=0)loc[ex]=u;else loc.push(u);saveLocalUsers(loc);audit("Acceso",phone);closeModal();toast("Acceso creado ✓");render();return;}

if(a==="close-session"){const se=session(id);$$(".att-sel").forEach(sel=>{let at=attFor(id,sel.dataset.st);if(!at){at={id:uid("at"),sessionId:id,studentId:sel.dataset.st,estado:"P",nota:null,notaOrigen:null,checkin:null,history:[]};S.attendance.push(at);}at.estado=sel.value;});$$(".nota-in").forEach(inp=>{const at=attFor(id,inp.dataset.st);if(at&&inp.value!==""){at.nota=Math.max(0,Math.min(20,+inp.value));at.notaOrigen="clase";}});closeSession(id);toast("Cerrada · notificada.");location.hash="#/docente";render();return;}
if(a==="save-corrections"){const se=session(id);if(!correctionOpen(se)){toast("Ventana cerrada. Usa FUT.","err");return;}let n=0;$$(".att-sel").forEach(sel=>{const at=attFor(id,sel.dataset.st);if(at&&at.estado!==sel.value){at.history.push({ts:Date.now(),from:at.estado,to:sel.value});at.estado=sel.value;n++;if(sel.value!=="F"){const st=student(at.studentId);queueMsg("erratas",st.id,"1","Fe de erratas: tu registro del "+fdate(se.fecha)+" fue corregido a "+sel.value+".");if(st.tutor)queueMsg("erratas",st.id,"2","Fe de erratas: registro de "+st.nombres+" corregido a "+sel.value+".");}}});$$(".nota-in").forEach(inp=>{const at=attFor(id,inp.dataset.st),v=inp.value===""?null:Math.max(0,Math.min(20,+inp.value));if(at&&at.nota!==v){at.history.push({ts:Date.now(),from:at.nota,to:v});at.nota=v;n++;}});audit("Corrección",id);toast(n?n+" correcciones.":"Sin cambios.");render();return;}
if(a==="fut-change"){const se=session(id);openModal("Cambio con FUT",`<form id="frm-futchange"><div class="field"><label>Código FUT</label><input name="code" required placeholder="GT-FUT-2026-000101"></div><div class="field"><label>Estudiante</label><select name="sid">${S.enrollments.filter(x=>x.groupId===se.groupId).map(x=>{const s=student(x.studentId);return `<option value="${s.id}">${esc(s.nombres)} ${esc(s.apellidos)}</option>`}).join("")}</select></div><div class="frow"><div class="field"><label>Asistencia</label><select name="est"><option>P</option><option>T</option><option>J</option></select></div><div class="field"><label>Nota</label><input name="nota" type="number" min="0" max="20" required></div></div></form>`,`<button class="btn btn-g" data-action="close-modal">Cancelar</button><button class="btn btn-p" data-action="submit-futchange" data-id="${id}">${icon("shield")} Aplicar</button>`);return;}
if(a==="submit-futchange"){const fd=new FormData($("#frm-futchange")),v=validateFut(fd.get("code"),fd.get("sid"),id);if(!v.ok){toast(v.err,"err");return;}let at=attFor(id,fd.get("sid"));if(!at){at={id:uid("at"),sessionId:id,studentId:fd.get("sid"),estado:"P",nota:null,notaOrigen:null,checkin:null,history:[]};S.attendance.push(at);}at.history.push({ts:Date.now(),fut:v.f.codigo});at.estado=fd.get("est");at.nota=Math.max(0,Math.min(20,+fd.get("nota")));at.notaOrigen="rezagado";v.f.estado="ejecutado";v.f.usadoEn=Date.now();audit("Cambio FUT",v.f.codigo);closeModal();toast("Aplicado ✓");render();return;}

document.addEventListener("change",e=>{const el=e.target,k=el.dataset.change;if(k==="est-filter"){ui.estFilter=el.value;render();}if(k==="report-student"){ui.reportStudent=el.value;render();}if(k==="pub-prog"){ui.pub={...ui.pub,prog:el.value,niv:"",ciclo:"",frec:"",turno:"",searched:false};render();}if(k==="pub-niv"){ui.pub={...ui.pub,niv:el.value,ciclo:"",frec:"",turno:"",searched:false};render();}if(k==="pub-ciclo"){ui.pub={...ui.pub,ciclo:el.value,frec:"",turno:"",searched:false};render();}if(k==="pub-frec"){ui.pub={...ui.pub,frec:el.value,turno:"",searched:false};render();}if(k==="pub-turno"){ui.pub={...ui.pub,turno:el.value,searched:false};render();}if(el.id==="import-json"){if(!guardSuper())return;const file=el.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.students||!data.groups)throw 0;S=data;save();toast("Importado ✓");render();}catch(err){toast("JSON inválido.","err");}};r.readAsText(file);}});
